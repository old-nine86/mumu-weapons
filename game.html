<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>沐沐积木沙盒战场 V6</title>
<style>
:root{--panel:rgba(22,24,32,.8);--panel2:rgba(22,24,32,.93);--line:rgba(255,255,255,.16);--gold:#ffd34f;--white:#fff7df}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:#10131b;color:var(--white);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{touch-action:none}
.game-shell{position:fixed;inset:0;isolation:isolate;background:#6fb8ef}
#gameCanvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;display:block}
.topbar{position:absolute;top:max(12px,env(safe-area-inset-top));left:12px;right:12px;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;z-index:5;pointer-events:none}
.back-link,.title-card,.pill,.icon-btn,.side-panel,.pad-btn{pointer-events:auto;border:1px solid var(--line);background:var(--panel);color:var(--white);box-shadow:0 10px 28px rgba(0,0,0,.25);backdrop-filter:blur(14px)}
.back-link{display:inline-flex;align-items:center;min-height:40px;padding:0 13px;border-radius:8px;text-decoration:none;font-weight:900}
.title-card{justify-self:start;min-width:0;padding:8px 12px;border-radius:8px}
.title-card h1{margin:0;font-size:17px;line-height:1.1;letter-spacing:0}
.title-card p{margin:4px 0 0;color:#d8eaff;font-size:12px;font-weight:800}
.status-grid{display:grid;grid-template-columns:repeat(4,minmax(72px,auto));gap:6px;justify-content:end}
.pill{min-height:40px;padding:7px 10px;border-radius:8px;font-weight:900;font-size:12px;line-height:1.15}
.pill strong{display:block;font-size:16px;color:var(--gold)}
.side-panel{position:absolute;right:12px;top:92px;width:min(300px,calc(100vw - 24px));z-index:5;padding:10px;border-radius:10px}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 8px}
.side-panel h2{margin:0;font-size:13px;letter-spacing:0;color:#d7e7ff}
.bag-toggle{display:none;width:34px;height:34px;border:1px solid rgba(255,255,255,.16);border-radius:8px;background:rgba(255,255,255,.08);color:var(--white);font-size:18px;font-weight:950;cursor:pointer}
.mini-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.mini-cell,.craft-btn{min-height:38px;border:1px solid rgba(255,255,255,.14);border-radius:8px;background:rgba(255,255,255,.06);color:var(--white);font-weight:900;font-size:12px;text-align:center}
.mini-cell{display:grid;place-items:center;padding:4px}
.craft-row{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.craft-btn{cursor:pointer}.craft-btn.ready{border-color:rgba(110,231,183,.7);background:rgba(45,212,191,.16)}
.quest-line{margin-top:8px;padding-top:8px;border-top:1px solid rgba(255,255,255,.12);font-size:12px;font-weight:800;color:#e8f4ff;line-height:1.35}.quest-line strong{color:var(--gold)}
.blueprint{position:absolute;left:12px;bottom:86px;width:min(280px,calc(100vw - 24px));z-index:5;padding:10px;border:1px solid var(--line);border-radius:10px;background:rgba(15,18,28,.72);box-shadow:0 12px 28px rgba(0,0,0,.26);font-weight:900;pointer-events:auto}
.blueprint h2{margin:0 0 8px;font-size:13px;color:#d7e7ff}.step-list{display:grid;gap:5px}.step{display:flex;align-items:center;gap:7px;font-size:12px;color:#cfe4ff}.step span{width:18px;height:18px;border-radius:6px;border:1px solid rgba(255,255,255,.18);display:grid;place-items:center;color:#10131b;background:#64748b}.step.done span{background:#6ee7b7}.step.active{color:#ffd34f}
.minimap{position:absolute;right:12px;bottom:86px;width:220px;height:86px;z-index:5;border:1px solid var(--line);border-radius:10px;background:rgba(15,18,28,.68);box-shadow:0 12px 28px rgba(0,0,0,.26);image-rendering:pixelated}
.toolbelt{position:absolute;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:8px;z-index:6;padding:8px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);box-shadow:0 14px 34px rgba(0,0,0,.32);backdrop-filter:blur(14px)}
.icon-btn{width:48px;height:48px;border-radius:8px;font-size:22px;font-weight:900;display:grid;place-items:center;cursor:pointer}.icon-btn.active{outline:2px solid var(--gold);background:rgba(255,211,79,.18)}
.mobile-pad{position:absolute;inset:auto auto max(14px,env(safe-area-inset-bottom)) 12px;width:min(366px,calc(100vw - 24px));height:54px;display:none;z-index:6;pointer-events:none}
.pad-group{position:absolute;left:0;bottom:0;display:flex;gap:8px;pointer-events:auto}.pad-group.actions{left:auto;right:0}
.pad-btn{width:48px;height:48px;border-radius:10px;font-size:22px;font-weight:900}
.pad-group.actions .pad-btn{width:50px}
.toast{position:absolute;left:50%;top:86px;transform:translateX(-50%);max-width:min(620px,calc(100vw - 28px));padding:10px 14px;border:1px solid var(--line);border-radius:8px;background:rgba(19,21,28,.9);box-shadow:0 14px 34px rgba(0,0,0,.28);font-weight:900;text-align:center;opacity:0;transition:opacity .2s,transform .2s;z-index:9;pointer-events:none}.toast.show{opacity:1;transform:translateX(-50%) translateY(4px)}
.overlay{position:absolute;inset:0;display:none;place-items:center;z-index:10;background:rgba(10,12,18,.52);backdrop-filter:blur(6px)}.overlay.show{display:grid}
.modal{width:min(460px,calc(100vw - 28px));padding:22px;border:1px solid var(--line);border-radius:10px;background:rgba(24,27,36,.94);box-shadow:0 22px 60px rgba(0,0,0,.4);text-align:center}.modal h2{margin:0 0 8px;font-size:26px}.modal p{margin:0 0 18px;color:#d7e7ff;font-weight:800}.modal button{min-height:44px;padding:0 18px;border:0;border-radius:8px;background:var(--gold);color:#2d2200;font-weight:950;cursor:pointer}
@media(max-width:860px){.topbar{grid-template-columns:1fr;right:auto;max-width:calc(100vw - 24px)}.status-grid{grid-template-columns:repeat(2,minmax(74px,1fr));justify-content:start}.title-card h1{font-size:15px}.side-panel{left:12px;right:auto;top:auto;bottom:154px;width:214px;padding:8px;transition:width .18s,padding .18s,background .18s}.panel-head{margin:0 0 8px}.bag-toggle{display:grid;place-items:center}.mini-grid{grid-template-columns:repeat(3,1fr)}.mini-cell,.craft-btn{min-height:32px;font-size:11px}.quest-line{display:none}.side-panel.collapsed{width:54px;padding:6px;border-radius:10px;background:rgba(22,24,32,.86)}.side-panel.collapsed .panel-head{margin:0}.side-panel.collapsed h2,.side-panel.collapsed .mini-grid,.side-panel.collapsed .craft-row,.side-panel.collapsed .quest-line{display:none}.side-panel.collapsed .bag-toggle{width:40px;height:40px}.blueprint,.minimap{display:none}.toolbelt{bottom:92px;gap:6px;padding:6px}.icon-btn{width:42px;height:42px;font-size:19px}.mobile-pad{display:block}.back-link{width:max-content}}
@media(max-width:520px){.title-card p{display:none}.pill{font-size:11px;min-height:36px;padding:6px 8px}.pill strong{font-size:14px}}
</style>
</head>
<body>
<main class="game-shell" aria-label="沐沐积木沙盒战场">
  <canvas id="gameCanvas" width="1280" height="720"></canvas>
  <div class="topbar">
    <a class="back-link" href="./" aria-label="返回武器库">← 武器库</a>
    <section class="title-card" aria-label="游戏标题"><h1>沐沐积木沙盒战场 V6</h1><p>场景密度：基地内装、洞穴暗部、影晶远景</p></section>
    <section class="status-grid" aria-label="战场状态">
      <div class="pill">生命<strong id="hpText">120</strong></div>
      <div class="pill">能量<strong id="energyText">100</strong></div>
      <div class="pill">时间<strong id="timeText">白昼</strong></div>
      <div class="pill">材料<strong id="bagText">0</strong></div>
    </section>
  </div>
  <aside class="blueprint" aria-label="蓝图目标"><h2>蓝图推进</h2><div class="step-list" id="blueprintSteps"></div></aside>
  <canvas class="minimap" id="minimap" width="220" height="86" aria-label="小地图"></canvas>
  <aside class="side-panel" id="bagPanel" aria-label="背包与合成"><div class="panel-head"><h2>背包</h2><button class="bag-toggle" id="bagToggle" type="button" aria-label="展开背包" aria-expanded="true">▣</button></div><div class="mini-grid" id="inventoryGrid"></div><div class="craft-row" id="craftGrid"></div><div class="quest-line" id="questLine"><strong>目标</strong> 探索地底</div></aside>
  <nav class="toolbelt" aria-label="工具栏">
    <button class="icon-btn active" type="button" data-tool="sword" title="近战">⚔</button>
    <button class="icon-btn" type="button" data-tool="blaster" title="远程">✦</button>
    <button class="icon-btn" type="button" data-tool="pick" title="挖掘">⛏</button>
    <button class="icon-btn" type="button" data-tool="block" title="放置">▣</button>
    <button class="icon-btn" type="button" data-tool="torch" title="照明">◆</button>
  </nav>
  <div class="mobile-pad" aria-hidden="false"><div class="pad-group"><button class="pad-btn" data-hold="left" type="button" aria-label="左">◀</button><button class="pad-btn" data-tap="jump" type="button" aria-label="跳">▲</button><button class="pad-btn" data-hold="right" type="button" aria-label="右">▶</button></div><div class="pad-group actions"><button class="pad-btn" data-tap="attack" type="button" aria-label="攻击">⚔</button><button class="pad-btn" data-tap="use" type="button" aria-label="使用">⛏</button></div></div>
  <div class="toast" id="toast"></div>
  <div class="overlay" id="endOverlay"><div class="modal"><h2 id="endTitle">战斗结束</h2><p id="endCopy">水晶核心等待下一轮修复。</p><button type="button" id="restartBtn">重新开战</button></div></div>
</main>
<script>
(()=>{
const canvas=document.getElementById('gameCanvas'),ctx=canvas.getContext('2d'),minimap=document.getElementById('minimap'),mctx=minimap.getContext('2d');
const hpText=document.getElementById('hpText'),energyText=document.getElementById('energyText'),timeText=document.getElementById('timeText'),bagText=document.getElementById('bagText');
const inventoryGrid=document.getElementById('inventoryGrid'),craftGrid=document.getElementById('craftGrid'),questLine=document.getElementById('questLine'),blueprintSteps=document.getElementById('blueprintSteps'),bagPanel=document.getElementById('bagPanel'),bagToggle=document.getElementById('bagToggle');
const toast=document.getElementById('toast'),endOverlay=document.getElementById('endOverlay'),endTitle=document.getElementById('endTitle'),endCopy=document.getElementById('endCopy'),restartBtn=document.getElementById('restartBtn');
const T=32,WORLD_W=380,WORLD_H=96,GRAVITY=.72,MAX_FALL=17;
const itemNames={dirt:'泥土',stone:'石块',wood:'木材',copper:'铜矿',iron:'铁矿',gold:'金矿',crystal:'晶片',torch:'火把',brick:'砖块',star:'星核'};
const solid=new Set([1,2,3,4,5,7,9,10,11,12,13,14,15,20,21,22]);
const dropOf={1:'dirt',2:'dirt',3:'stone',4:'copper',7:'wood',8:'wood',9:'iron',10:'gold',11:'crystal',12:'dirt',13:'brick',14:'wood',15:'wood',20:'wood',21:'stone',22:'iron'};
const hard={1:1,2:1,3:2.1,4:2.6,7:1,8:.7,9:3.2,10:4.1,11:3,12:1,13:2,14:1.5,15:1,20:1.4,21:2.6,22:2.8};
const colors={1:['#5caa59','#36713d'],2:['#8a5a36','#62391f'],3:['#68717c','#424954'],4:['#7b6048','#f59e5b'],5:['#ffe07a','#ff8a4f'],6:['#ffef99','#ffb84d'],7:['#8b5a2b','#5f3719'],8:['#62b65e','#2f7a3a'],9:['#596b74','#cbd5e1'],10:['#765f2a','#facc15'],11:['#51406d','#a78bfa'],12:['#d8b871','#9b7a35'],13:['#9c6650','#653727'],14:['#9a642f','#fbbf24'],15:['#7b4b24','#b7791f'],16:['#2dd4bf','#0f766e'],17:['#fb923c','#b91c1c'],18:['#c084fc','#6d28d9'],20:['#8b5a2b','#fbbf24'],21:['#475569','#f97316'],22:['#334155','#cbd5e1']};
const recipes=[
  {id:'torch',name:'火把',cost:{wood:1,crystal:1},make:{torch:4}},
  {id:'brick',name:'砖块',cost:{stone:3,dirt:1},make:{brick:4}},
  {id:'sword2',name:'铜剑',cost:{wood:4,copper:8},flag:'sword2'},
  {id:'pick2',name:'铁镐',cost:{wood:5,iron:10},flag:'pick2'},
  {id:'blaster2',name:'星能枪',cost:{copper:8,crystal:8,gold:4},flag:'blaster2'},
  {id:'bossReady',name:'星核祭坛',cost:{gold:8,crystal:14},flag:'bossReady'}
];
let world,player,camera,enemies,projectiles,particles,pickups,core,pointer,keys,lastTime,toastTimer,mineTarget,spawnTimer,saveTimer,timeOfDay,day,activeBiome,gameOver,bossSpawned,openedChests;
const npc={x:0,y:0,w:22,h:38,talk:0};
function resize(){const dpr=Math.min(2,window.devicePixelRatio||1);canvas.width=Math.floor(innerWidth*dpr);canvas.height=Math.floor(innerHeight*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}
window.addEventListener('resize',resize,{passive:true});resize();
function rand(seed){let t=seed+0x6D2B79F5;return()=>{t+=0x6D2B79F5;let r=Math.imul(t^t>>>15,1|t);r^=r+Math.imul(r^r>>>7,61|r);return((r^r>>>14)>>>0)/4294967296}}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function tileAt(tx,ty){return world[ty]&&world[ty][tx]||0}
function setTile(tx,ty,v){if(world[ty]&&tx>=0&&tx<WORLD_W)world[ty][tx]=v}
function isSolidAt(px,py){return solid.has(tileAt(Math.floor(px/T),Math.floor(py/T)))}
function tileUnder(e){return tileAt(Math.floor((e.x+e.w/2)/T),Math.floor((e.y+e.h)/T))}
function onLadder(e){return tileAt(Math.floor((e.x+e.w/2)/T),Math.floor((e.y+e.h/2)/T))===19}
function rectHits(x,y,w,h){return isSolidAt(x,y)||isSolidAt(x+w,y)||isSolidAt(x,y+h)||isSolidAt(x+w,y+h)}
function screenToWorld(x,y){return{x:x+camera.x,y:y+camera.y}}
function biomeAt(tx){if(tx<WORLD_W*.22)return'森林';if(tx<WORLD_W*.42)return'沙原';if(tx<WORLD_W*.68)return'绿岭';if(tx<WORLD_W*.84)return'影晶地';return'高地'}
function buildWorld(){
  const rnd=rand(5312026),map=Array.from({length:WORLD_H},()=>Array(WORLD_W).fill(0));
  for(let x=0;x<WORLD_W;x++){
    const biome=biomeAt(x),surface=24+Math.floor(Math.sin(x*.06)*5+Math.sin(x*.017)*9+rnd()*3);
    for(let y=surface;y<WORLD_H;y++){
      const depth=y-surface;let tile=y===surface?(biome==='沙原'?12:biome==='影晶地'?11:1):depth<5?(biome==='沙原'?12:2):3;
      if(depth>8&&rnd()<.055)tile=4;if(depth>17&&rnd()<.04)tile=9;if(depth>30&&rnd()<.025)tile=10;if(biome==='影晶地'&&depth<11&&rnd()<.18)tile=11;
      if(depth>7&&rnd()<.085)tile=0;if(depth>18&&rnd()<.06)tile=0;if(depth>34&&rnd()<.04)tile=0;map[y][x]=tile;
    }
    if((biome==='森林'||biome==='高地')&&rnd()<.18){
      const sy=surface-1;for(let h=0;h<rnd()*3+3;h++)map[sy-h][x]=7;
      for(let yy=sy-6;yy<=sy-3;yy++)for(let xx=x-2;xx<=x+2;xx++)if(map[yy]&&xx>=0&&xx<WORLD_W&&!map[yy][xx]&&Math.abs(xx-x)+Math.abs(yy-(sy-4))<4)map[yy][xx]=8;
    }
  }
  const cx=24,cy=22;for(let y=cy-4;y<=cy+4;y++)for(let x=cx-5;x<=cx+5;x++)if(map[y])map[y][x]=0;
  for(let x=cx-6;x<=cx+7;x++){map[cy-1][x]=13;map[cy+4][x]=13}
  for(let y=cy-1;y<=cy+4;y++){map[y][cx-6]=13;map[y][cx+7]=13}
  for(let x=cx-3;x<=cx+3;x++)map[cy+1][x]=15;
  for(let y=cy-2;y<=cy+5;y++)map[y][cx+5]=19;
  map[cy+3][cx]=5;map[cy+2][cx]=5;map[cy+1][cx]=6;map[cy+3][cx-4]=14;map[cy+3][cx+4]=14;map[cy+3][cx-2]=20;map[cy+3][cx+2]=21;map[cy+3][cx+3]=22;
  for(let x=cx+8;x<=cx+13;x++)map[cy+2][x]=15;
  for(let y=cy-5;y<=cy+2;y++)map[y][cx+11]=19;
  for(let x=0;x<WORLD_W;x++){const cave=48+Math.floor(Math.sin(x*.08)*8);for(let y=cave;y<cave+3;y++)if(map[y])map[y][x]=0}
  addFeaturePools(map);
  addBossArena(map);
  return{map,core:{x:cx*T,y:(cy+2)*T,hp:260,max:260}};
}
function addFeaturePools(map){
  [[42,34,8,3,16],[74,58,7,4,16],[122,71,10,3,17],[206,66,12,4,17],[304,47,7,4,18]].forEach(([sx,sy,w,h,t])=>{
    for(let y=sy;y<sy+h;y++)for(let x=sx;x<sx+w;x++)if(map[y]&&x>=0&&x<WORLD_W)map[y][x]=t;
  });
  [[52,40],[88,55],[142,63],[242,58],[314,38]].forEach(([x,y])=>{if(map[y])map[y][x]=14});
  for(let y=35;y<54;y++)map[y][86]=19;
  for(let x=82;x<93;x++)map[54][x]=15;
}
function addBossArena(map){
  const ax=306,ay=67;
  for(let y=ay-7;y<=ay+5;y++)for(let x=ax-13;x<=ax+13;x++)if(map[y])map[y][x]=0;
  for(let x=ax-11;x<=ax+11;x++){map[ay+5][x]=11;map[ay-7][x]=11}
  for(let y=ay-6;y<=ay+5;y++){map[y][ax-13]=11;map[y][ax+13]=11}
  for(let x=ax-5;x<=ax+5;x++)map[ay+4][x]=15;
  map[ay+3][ax]=18;map[ay+2][ax]=18;map[ay+1][ax]=18;
}
function reset(){
  const built=buildWorld();world=built.map;core=built.core;
  player={x:16*T,y:17*T,w:24,h:42,vx:0,vy:0,face:1,onGround:false,hp:120,maxHp:120,energy:100,tool:'sword',cool:0,iframes:0,inv:{dirt:28,stone:12,wood:10,copper:0,iron:0,gold:0,crystal:0,torch:5,brick:0,star:0},flags:{},score:0,depth:0};
  npc.x=22*T;npc.y=21*T;npc.talk=0;camera={x:0,y:0,shake:0};enemies=[];projectiles=[];particles=[];pickups=[];openedChests=new Set();spawnTimer=0;saveTimer=0;timeOfDay=9.5;day=1;activeBiome='森林';gameOver=false;bossSpawned=false;mineTarget=null;pointer={x:innerWidth/2,y:innerHeight/2,down:false,button:0};keys={};lastTime=performance.now();endOverlay.classList.remove('show');loadProgress();spawnPack(4);notice('V6 场景密度推进：基地内装、洞穴暗部和影晶远景上线。');
}
function findSurface(tx){for(let y=0;y<WORLD_H;y++)if(solid.has(tileAt(tx,y)))return y;return WORLD_H-2}
function moveEntity(e){if(!e.player||!onLadder(e))e.vy=clamp(e.vy+GRAVITY,-30,MAX_FALL);e.x+=e.vx;if(rectHits(e.x,e.y,e.w,e.h)){const s=Math.sign(e.vx)||1;let guard=0;while(rectHits(e.x,e.y,e.w,e.h)&&guard++<80)e.x-=s;e.vx=0}e.y+=e.vy;e.onGround=false;if(rectHits(e.x,e.y,e.w,e.h)){const s=Math.sign(e.vy)||1;let guard=0;while(rectHits(e.x,e.y,e.w,e.h)&&guard++<80)e.y-=s;if(s>0)e.onGround=true;e.vy=0}}
function spawnPack(count,boss=false){for(let i=0;i<count;i++){const side=i%2?-1:1,x=clamp(player.x+side*(520+i*64),T*5,T*(WORLD_W-8)),y=findSurface(Math.floor(x/T))*T-44,deep=player.y>WORLD_H*T*.52,night=isNight(),type=boss?9:(deep?3:(activeBiome==='影晶地'?2:(night?1:0))),hp=boss?360:(38+day*6+type*12);enemies.push({x,y,w:boss?72:28,h:boss?66:34,vx:0,vy:0,hp,max:hp,hit:0,type,boss})}notice(boss?'星核守卫出现了。':'周围有新的暗影积木活动。')}
function gain(item,n){player.inv[item]=(player.inv[item]||0)+n}
function drop(x,y,item,n){for(let i=0;i<n;i++)pickups.push({x,y,vx:(Math.random()-.5)*4,vy:-3-Math.random()*2,item,life:1200})}
function burst(x,y,color,n){for(let i=0;i<n;i++)particles.push({x,y,vx:(Math.random()-.5)*5,vy:(Math.random()-.8)*5,life:28+Math.random()*18,color})}
function notice(text){clearTimeout(toastTimer);toast.textContent=text;toast.classList.add('show');toastTimer=setTimeout(()=>toast.classList.remove('show'),2200)}

function drawMiniHero(x,y,face,p){const walk=Math.sin(performance.now()*.012+(p.phase||0)),bob=walk*1.1,flip=face<0?-1:1,cx=x+13;px(x+1,y+42,28,5,'rgba(0,0,0,.32)');px(x+5,y+31+bob,7,13,p.boot);px(x+16,y+31-bob,7,13,p.boot);px(x+4,y+38+bob,8,5,p.sole);px(x+15,y+38-bob,9,5,p.sole);

function drawEnemy(e){const x=e.x,y=e.y;if(e.boss){ctx.fillStyle='rgba(168,85,247,.28)';ctx.fillRect(x-18,y-16,e.w+36,e.h+32);ctx.fillStyle=e.hit?'#ffd1dc':'#1c1530';ctx.fillRect(x,y+10,e.w,e.h-8);ctx.fillStyle='#4c1d95';ctx.fillRect(x+12,y,e.w-24,22);ctx.fillStyle='#f0abfc';ctx.fillRect(x+22,y+20,8,8);ctx.fillRect(x+e.w-30,y+20,8,8);ctx.fillStyle='#a855f7';ctx.fillRect(x+e.w/2-12,y+30,24,22);ctx.fillStyle='#251827';ctx.fillRect(x,y-10,e.w,5);ctx.fillStyle='#facc15';ctx.fillRect(x,y-10,e.w*clamp(e.hp/e.max,0,1),5);return}ctx.fillStyle='rgba(124,58,237,.2)';ctx.fillRect(x-8,y-2,e.w+16,e.h+12);ctx.fillStyle=e.hit?'#ffd1dc':(e.type>=2?'#3d235f':'#2f2442');ctx.fillRect(x,y+6,e.w,e.h-6);ctx.fillStyle='rgba(255,255,255,.1)';ctx.fillRect(x+4,y+9,e.w-8,7);ctx.fillStyle=e.type===1?'#fb7185':'#a78bfa';ctx.fillRect(x+5,y,e.w-10,12);ctx.fillStyle='#101018';ctx.fillRect(x+7,y+14,5,5);ctx.fillRect(x+17,y+14,5,5);ctx.fillStyle='#c084fc';ctx.fillRect(x+8,y+15,3,3);ctx.fillRect(x+18,y+15,3,3);ctx.fillStyle='#16151d';ctx.fillRect(x+3,y+e.h,e.w-6,5);ctx.fillStyle='#251827';ctx.fillRect(x,y-8,e.w,4);ctx.fillStyle='#fb7185';ctx.fillRect(x,y-8,e.w*clamp(e.hp/e.max,0,1),4)}

function drawAim(){const pos=screenToWorld(pointer.x,pointer.y),tx=Math.floor(pos.x/T),ty=Math.floor(pos.y/T);ctx.strokeStyle='rgba(255,255,255,.75)';ctx.lineWidth=2;ctx.strokeRect(tx*T+2,ty*T+2,T-4,T-4);if(mineTarget){const parts=mineTarget.key.split(',').map(Number),progress=clamp(mineTarget.work/(hard[tileAt(parts[0],parts[1])]||1),0,1);ctx.fillStyle='rgba(255,211,79,.8)';ctx.fillRect(parts[0]*T+4,parts[1]*T+26,(T-8)*progress,3)}}
function drawMinimap(){mctx.clearRect(0,0,minimap.width,minimap.height);mctx.fillStyle='rgba(8,11,18,.82)';mctx.fillRect(0,0,minimap.width,minimap.height);const sx=minimap.width/WORLD_W,sy=minimap.height/WORLD_H;for(let y=0;y<WORLD_H;y+=2)for(let x=0;x<WORLD_W;x+=2){const t=tileAt(x,y);if(!t)continue;mctx.fillStyle=t===16?'#2dd4bf':t===17?'#fb923c':t===18?'#c084fc':t===20?'#fbbf24':t===21?'#f97316':t===22?'#cbd5e1':t===11?'#7c3aed':t===10?'#facc15':t===9?'#cbd5e1':t===4?'#fb923c':t===12?'#d8b871':t===1?'#65a30d':'#64748b';mctx.fillRect(x*sx,y*sy,Math.max(1,sx*2),Math.max(1,sy*2))}mctx.fillStyle='#60a5fa';mctx.fillRect(player.x/T*sx-2,player.y/T*sy-2,4,4);mctx.fillStyle='#6ee7b7';mctx.fillRect(npc.x/T*sx-2,npc.y/T*sy-2,4,4);mctx.fillStyle='#ffd34f';mctx.fillRect(core.x/T*sx-2,core.y/T*sy-2,4,4);mctx.strokeStyle='rgba(255,255,255,.55)';mctx.strokeRect(camera.x/T*sx,camera.y/T*sy,innerWidth/T*sx,innerHeight/T*sy)}

function draw(){const vw=innerWidth,vh=innerHeight;ctx.clearRect(0,0,vw,vh);const sx=camera.shake?Math.sin(performance.now()*.06)*camera.shake:0,sy=camera.shake?Math.cos(performance.now()*.05)*camera.shake:0;drawSky(vw,vh);ctx.save();ctx.translate(-Math.floor(camera.x)+sx,-Math.floor(camera.y)+sy);drawCaveBackdrops();drawBossSet();drawBaseInterior();drawWorld();drawCore();projectiles.forEach(drawProjectile);pickups.forEach(drawPickup);enemies.forEach(drawEnemy);drawNpc();drawPlayer();particles.forEach(drawParticle);drawAim();ctx.restore();drawLightVeil(vw,vh);drawMinimap()}
function loop(now){const dt=Math.min(33,now-lastTime);lastTime=now;update(dt/16.67);draw();requestAnimationFrame(loop)}
function syncTools(){document.querySelectorAll('[data-tool]').forEach(btn=>btn.classList.toggle('active',btn.dataset.tool===player.tool))}
document.querySelectorAll('[data-tool]').forEach(btn=>btn.addEventListener('click',()=>{player.tool=btn.dataset.tool;syncTools()}));
bagToggle.addEventListener('click',()=>setBagCollapsed(!bagPanel.classList.contains('collapsed')));
window.addEventListener('resize',syncBagForViewport,{passive:true});
craftGrid.addEventListener('click',e=>{const btn=e.target.closest('[data-craft]');if(!btn)return;const r=recipes.find(x=>x.id===btn.dataset.craft);if(r)craft(r)});
window.addEventListener('keydown',e=>{keys[e.code]=true;if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();if(e.code==='Digit1')player.tool='sword';if(e.code==='Digit2')player.tool='blaster';if(e.code==='Digit3')player.tool='pick';if(e.code==='Digit4')player.tool='block';if(e.code==='Digit5')player.tool='torch';syncTools()});
window.addEventListener('keyup',e=>{keys[e.code]=false});canvas.addEventListener('pointermove',e=>{pointer.x=e.clientX;pointer.y=e.clientY});canvas.addEventListener('pointerdown',e=>{pointer.down=true;pointer.button=e.button;pointer.x=e.clientX;pointer.y=e.clientY;canvas.setPointerCapture(e.pointerId);if(e.button===2)player.tool='block';syncTools()});canvas.addEventListener('pointerup',()=>{pointer.down=false;mineTarget=null});canvas.addEventListener('contextmenu',e=>e.preventDefault());
document.querySelectorAll('[data-hold]').forEach(btn=>{const key=btn.dataset.hold;btn.addEventListener('pointerdown',()=>{keys[key]=true});btn.addEventListener('pointerup',()=>{keys[key]=false});btn.addEventListener('pointercancel',()=>{keys[key]=false});btn.addEventListener('pointerleave',()=>{keys[key]=false})});
document.querySelectorAll('[data-tap]').forEach(btn=>btn.addEventListener('click',()=>{keys[btn.dataset.tap]=true}));
restartBtn.addEventListener('click',reset);syncBagForViewport();reset();requestAnimationFrame(loop);
})();

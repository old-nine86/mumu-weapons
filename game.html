<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>沐沐积木沙盒战场 V7</title>
<style>
:root{--panel:rgba(22,24,32,.8);--panel2:rgba(22,24,32,.93);--line:rgba(255,255,255,.16);--gold:#ffd34f;--white:#fff7df}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:#10131b;color:var(--white);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{touch-action:none}
.game-shell{position:fixed;inset:0;isolation:isolate;background:#6fb8ef}
#gameCanvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;display:block}
.topbar{position:absolute;top:max(12px,env(safe-area-inset-top));left:12px;right:12px;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;z-index:5;pointer-events:none}
.back-link,.title-card,.pill,.icon-btn,.side-panel,.pad-btn{pointer-events:auto;border:1px solid var(--line);background:var(--panel);color:var(--white);box-shadow:0 10px 28px rgba(0,0,0,.25);backdrop-filter:blur(14px)}
.back-link{display:inline-flex;align-items:center;min-height:40px;padding:0 13px;border-radius:8px;text-decoration:none;font-weight:900}
.title-card{justify-self:start;min-width:0;padding:8px 12px;border-radius:8px}
.title-card h1{margin:0;font-size:17px;line-height:1.1;letter-spacing:0}
.title-card p{margin:4px 0 0;color:#d8eaff;font-size:12px;font-weight:800}
.status-grid{display:grid;grid-template-columns:repeat(4,minmax(72px,auto));gap:6px;justify-content:end}
.pill{min-height:40px;padding:7px 10px;border-radius:8px;font-weight:900;font-size:12px;line-height:1.15}
.pill strong{display:block;font-size:16px;color:var(--gold)}
.side-panel{position:absolute;right:12px;top:92px;width:min(300px,calc(100vw - 24px));z-index:5;padding:10px;border-radius:10px}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 8px}
.side-panel h2{margin:0;font-size:13px;letter-spacing:0;color:#d7e7ff}
.bag-toggle{display:none;width:34px;height:34px;border:1px solid rgba(255,255,255,.16);border-radius:8px;background:rgba(255,255,255,.08);color:var(--white);font-size:18px;font-weight:950;cursor:pointer}
.mini-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.mini-cell,.craft-btn{min-height:38px;border:1px solid rgba(255,255,255,.14);border-radius:8px;background:rgba(255,255,255,.06);color:var(--white);font-weight:900;font-size:12px;text-align:center}
.mini-cell{display:grid;place-items:center;padding:4px}
.craft-row{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.craft-btn{cursor:pointer}.craft-btn.ready{border-color:rgba(110,231,183,.7);background:rgba(45,212,191,.16)}
.quest-line{margin-top:8px;padding-top:8px;border-top:1px solid rgba(255,255,255,.12);font-size:12px;font-weight:800;color:#e8f4ff;line-height:1.35}.quest-line strong{color:var(--gold)}
.blueprint{position:absolute;left:12px;bottom:86px;width:min(280px,calc(100vw - 24px));z-index:5;padding:10px;border:1px solid var(--line);border-radius:10px;background:rgba(15,18,28,.72);box-shadow:0 12px 28px rgba(0,0,0,.26);font-weight:900;pointer-events:auto}
.blueprint h2{margin:0 0 8px;font-size:13px;color:#d7e7ff}.step-list{display:grid;gap:5px}.step{display:flex;align-items:center;gap:7px;font-size:12px;color:#cfe4ff}.step span{width:18px;height:18px;border-radius:6px;border:1px solid rgba(255,255,255,.18);display:grid;place-items:center;color:#10131b;background:#64748b}.step.done span{background:#6ee7b7}.step.active{color:#ffd34f}
.minimap{position:absolute;right:12px;bottom:86px;width:220px;height:86px;z-index:5;border:1px solid var(--line);border-radius:10px;background:rgba(15,18,28,.68);box-shadow:0 12px 28px rgba(0,0,0,.26);image-rendering:pixelated}
.toolbelt{position:absolute;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:8px;z-index:6;padding:8px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);box-shadow:0 14px 34px rgba(0,0,0,.32);backdrop-filter:blur(14px)}
.icon-btn{width:48px;height:48px;border-radius:8px;font-size:22px;font-weight:900;display:grid;place-items:center;cursor:pointer}.icon-btn.active{outline:2px solid var(--gold);background:rgba(255,211,79,.18)}
.build-palette{position:absolute;left:50%;bottom:82px;transform:translateX(-50%);display:flex;gap:6px;z-index:8;padding:6px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);box-shadow:0 12px 28px rgba(0,0,0,.28);backdrop-filter:blur(14px)}
.build-btn{width:42px;height:42px;border:1px solid rgba(255,255,255,.14);border-radius:8px;background:rgba(255,255,255,.06);color:var(--white);font-weight:950;font-size:10px;display:grid;place-items:center;gap:1px;cursor:pointer}.build-btn span{width:18px;height:12px;border-radius:3px;box-shadow:inset 0 2px rgba(255,255,255,.2),inset 0 -3px rgba(0,0,0,.22)}.build-btn.active{outline:2px solid var(--gold);background:rgba(255,211,79,.16)}
.mobile-pad{position:absolute;inset:auto auto max(14px,env(safe-area-inset-bottom)) 12px;width:min(366px,calc(100vw - 24px));height:54px;display:none;z-index:6;pointer-events:none}
.pad-group{position:absolute;left:0;bottom:0;display:flex;gap:8px;pointer-events:auto}.pad-group.actions{left:auto;right:0}
.pad-btn{width:48px;height:48px;border-radius:10px;font-size:22px;font-weight:900}
.pad-group.actions .pad-btn{width:50px}
.toast{position:absolute;left:50%;top:86px;transform:translateX(-50%);max-width:min(620px,calc(100vw - 28px));padding:10px 14px;border:1px solid var(--line);border-radius:8px;background:rgba(19,21,28,.9);box-shadow:0 14px 34px rgba(0,0,0,.28);font-weight:900;text-align:center;opacity:0;transition:opacity .2s,transform .2s;z-index:9;pointer-events:none}.toast.show{opacity:1;transform:translateX(-50%) translateY(4px)}
.overlay{position:absolute;inset:0;display:none;place-items:center;z-index:10;background:rgba(10,12,18,.52);backdrop-filter:blur(6px)}.overlay.show{display:grid}
.modal{width:min(460px,calc(100vw - 28px));padding:22px;border:1px solid var(--line);border-radius:10px;background:rgba(24,27,36,.94);box-shadow:0 22px 60px rgba(0,0,0,.4);text-align:center}.modal h2{margin:0 0 8px;font-size:26px}.modal p{margin:0 0 18px;color:#d7e7ff;font-weight:800}.modal button{min-height:44px;padding:0 18px;border:0;border-radius:8px;background:var(--gold);color:#2d2200;font-weight:950;cursor:pointer}
@media(max-width:860px){.topbar{grid-template-columns:1fr;right:auto;max-width:calc(100vw - 24px)}.status-grid{grid-template-columns:repeat(2,minmax(74px,1fr));justify-content:start}.title-card h1{font-size:15px}.side-panel{left:12px;right:auto;top:auto;bottom:154px;width:214px;padding:8px;transition:width .18s,padding .18s,background .18s}.panel-head{margin:0 0 8px}.bag-toggle{display:grid;place-items:center}.mini-grid{grid-template-columns:repeat(3,1fr)}.mini-cell,.craft-btn{min-height:32px;font-size:11px}.quest-line{display:none}.side-panel.collapsed{width:54px;padding:6px;border-radius:10px;background:rgba(22,24,32,.86)}.side-panel.collapsed .panel-head{margin:0}.side-panel.collapsed h2,.side-panel.collapsed .mini-grid,.side-panel.collapsed .craft-row,.side-panel.collapsed .quest-line{display:none}.side-panel.collapsed .bag-toggle{width:40px;height:40px}.blueprint,.minimap{display:none}.build-palette{bottom:148px;max-width:calc(100vw - 96px);overflow-x:auto}.build-btn{width:38px;height:34px;font-size:9px;flex:0 0 auto}.toolbelt{bottom:92px;gap:6px;padding:6px}.icon-btn{width:42px;height:42px;font-size:19px}.mobile-pad{display:block}.back-link{width:max-content}.toast{top:auto;bottom:208px;font-size:12px}}
@media(max-width:520px){.title-card p{display:none}.pill{font-size:11px;min-height:36px;padding:6px 8px}.pill strong{font-size:14px}}
</style>
</head>
<body>
<main class="game-shell" aria-label="沐沐积木沙盒战场">
  <canvas id="gameCanvas" width="1280" height="720"></canvas>
  <div class="topbar">
    <a class="back-link" href="./" aria-label="返回武器库">← 武器库</a>
    <section class="title-card" aria-label="游戏标题"><h1>沐沐积木沙盒战场 V7</h1><p>美术推进：动作感、敌人层次、场景装饰</p></section>
    <section class="status-grid" aria-label="战场状态">
      <div class="pill">生命<strong id="hpText">120</strong></div>
      <div class="pill">能量<strong id="energyText">100</strong></div>
      <div class="pill">时间<strong id="timeText">白昼</strong></div>
      <div class="pill">材料<strong id="bagText">0</strong></div>
    </section>
  </div>
  <aside class="blueprint" aria-label="蓝图目标"><h2>蓝图推进</h2><div class="step-list" id="blueprintSteps"></div></aside>
  <canvas class="minimap" id="minimap" width="220" height="86" aria-label="小地图"></canvas>
  <aside class="side-panel" id="bagPanel" aria-label="背包与合成"><div class="panel-head"><h2>背包</h2><button class="bag-toggle" id="bagToggle" type="button" aria-label="展开背包" aria-expanded="true">▣</button></div><div class="mini-grid" id="inventoryGrid"></div><div class="craft-row" id="craftGrid"></div><div class="quest-line" id="questLine"><strong>目标</strong> 探索地底</div></aside>
  <nav class="build-palette" id="buildPalette" aria-label="建造材料"></nav>
  <nav class="toolbelt" aria-label="工具栏">
    <button class="icon-btn active" type="button" data-tool="sword" title="近战">⚔</button>
    <button class="icon-btn" type="button" data-tool="blaster" title="远程">✦</button>
    <button class="icon-btn" type="button" data-tool="pick" title="挖掘">⛏</button>
    <button class="icon-btn" type="button" data-tool="block" title="放置">▣</button>
    <button class="icon-btn" type="button" data-tool="torch" title="照明">◆</button>
  </nav>
  <div class="mobile-pad" aria-hidden="false"><div class="pad-group"><button class="pad-btn" data-hold="left" type="button" aria-label="左">◀</button><button class="pad-btn" data-tap="jump" type="button" aria-label="跳">▲</button><button class="pad-btn" data-hold="right" type="button" aria-label="右">▶</button></div><div class="pad-group actions"><button class="pad-btn" data-tap="attack" type="button" aria-label="攻击">⚔</button><button class="pad-btn" data-tap="use" type="button" aria-label="使用">⛏</button></div></div>
  <div class="toast" id="toast"></div>
  <div class="overlay" id="endOverlay"><div class="modal"><h2 id="endTitle">战斗结束</h2><p id="endCopy">水晶核心等待下一轮修复。</p><button type="button" id="restartBtn">重新开战</button></div></div>
</main>
<script type="module">
import{
  GRAVITY,MAX_FALL_SPEED,TILE_COLORS,TILE_SIZE,WORLD_HEIGHT,WORLD_WIDTH,
  SOLID_TILES,biomeAt,buildWorld
}from'./game/world.mjs';
import{
  BUILD_ITEMS,ITEM_NAMES,RECIPES,TILE_HARDNESS,
  addInventory,applyRecipe,canCraft as canCraftState,
  findBuildItem,miningHit,placementResult,rectsOverlap
}from'./game/rules.mjs';
import{
  createSaveSnapshot,loadSandboxState,saveSandboxState
}from'./game/persistence.mjs';
import{
  applyMovementIntent,applyTerrainState,createPlayer,healPlayer,tickPlayerVitals
}from'./game/player.mjs';
import{
  bindGameInput,consumeAction,createInputState,movementIntent,resetInputState
}from'./game/input.mjs';
import{
  applyPlayerHit,attackHits,createEnemyState,damageEnemyState,enemyMotion,startAttack
}from'./game/combat.mjs';
import{
  createHudModel,renderHud,setBagCollapsed as updateBagCollapsed
}from'./game/ui.mjs';

(()=>{
const canvas=document.getElementById('gameCanvas'),ctx=canvas.getContext('2d'),minimap=document.getElementById('minimap'),mctx=minimap.getContext('2d');
const hpText=document.getElementById('hpText'),energyText=document.getElementById('energyText'),timeText=document.getElementById('timeText'),bagText=document.getElementById('bagText');
const inventoryGrid=document.getElementById('inventoryGrid'),craftGrid=document.getElementById('craftGrid'),questLine=document.getElementById('questLine'),blueprintSteps=document.getElementById('blueprintSteps'),bagPanel=document.getElementById('bagPanel'),bagToggle=document.getElementById('bagToggle'),buildPalette=document.getElementById('buildPalette');
const toast=document.getElementById('toast'),endOverlay=document.getElementById('endOverlay'),endTitle=document.getElementById('endTitle'),endCopy=document.getElementById('endCopy'),restartBtn=document.getElementById('restartBtn');
const T=TILE_SIZE,WORLD_W=WORLD_WIDTH,WORLD_H=WORLD_HEIGHT,MAX_FALL=MAX_FALL_SPEED;
const itemNames=ITEM_NAMES,buildItems=BUILD_ITEMS,solid=SOLID_TILES,hard=TILE_HARDNESS,colors=TILE_COLORS,recipes=RECIPES;
const keys=createInputState();
let world,worldEdits,player,camera,enemies,projectiles,particles,pickups,core,pointer,lastTime,toastTimer,mineTarget,spawnTimer,saveTimer,timeOfDay,day,activeBiome,gameOver,bossSpawned,openedChests,selectedBuild='dirt';
const npc={x:0,y:0,w:22,h:38,talk:0};
function resize(){const dpr=Math.min(2,window.devicePixelRatio||1);canvas.width=Math.floor(innerWidth*dpr);canvas.height=Math.floor(innerHeight*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}
window.addEventListener('resize',resize,{passive:true});resize();
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function tileAt(tx,ty){return world[ty]&&world[ty][tx]||0}
function setTile(tx,ty,v){if(world[ty]&&tx>=0&&tx<WORLD_W){world[ty][tx]=v;worldEdits.set(tx+','+ty,v)}}
function isSolidAt(px,py){return solid.has(tileAt(Math.floor(px/T),Math.floor(py/T)))}
function tileUnder(e){return tileAt(Math.floor((e.x+e.w/2)/T),Math.floor((e.y+e.h)/T))}
function onLadder(e){return tileAt(Math.floor((e.x+e.w/2)/T),Math.floor((e.y+e.h/2)/T))===19}
function rectHits(x,y,w,h){return isSolidAt(x,y)||isSolidAt(x+w,y)||isSolidAt(x,y+h)||isSolidAt(x+w,y+h)}
function screenToWorld(x,y){return{x:x+camera.x,y:y+camera.y}}
function reset(){
  const built=buildWorld();world=built.map;core=built.core;
  worldEdits=new Map();
  player=createPlayer(T);
  npc.x=22*T;npc.y=21*T;npc.talk=0;camera={x:0,y:0,shake:0};enemies=[];projectiles=[];particles=[];pickups=[];openedChests=new Set();spawnTimer=0;saveTimer=0;timeOfDay=9.5;day=1;activeBiome='森林';gameOver=false;bossSpawned=false;mineTarget=null;pointer={x:innerWidth/2,y:innerHeight/2,down:false,button:0};resetInputState(keys);lastTime=performance.now();endOverlay.classList.remove('show');loadProgress();spawnPack(4);notice('V7 美术推进：角色动作、敌人层次和场景装饰上线。');
}
function findSurface(tx){for(let y=0;y<WORLD_H;y++)if(solid.has(tileAt(tx,y)))return y;return WORLD_H-2}
function moveEntity(e){if(!e.player||!onLadder(e))e.vy=clamp(e.vy+GRAVITY,-30,MAX_FALL);e.x+=e.vx;if(rectHits(e.x,e.y,e.w,e.h)){const s=Math.sign(e.vx)||1;let guard=0;while(rectHits(e.x,e.y,e.w,e.h)&&guard++<80)e.x-=s;e.vx=0}e.y+=e.vy;e.onGround=false;if(rectHits(e.x,e.y,e.w,e.h)){const s=Math.sign(e.vy)||1;let guard=0;while(rectHits(e.x,e.y,e.w,e.h)&&guard++<80)e.y-=s;if(s>0)e.onGround=true;e.vy=0}}
function spawnPack(count,boss=false){for(let i=0;i<count;i++){const side=i%2?-1:1,x=clamp(player.x+side*(520+i*64),T*5,T*(WORLD_W-8)),y=findSurface(Math.floor(x/T))*T-44;enemies.push(createEnemyState({x,y,boss,deep:player.y>WORLD_H*T*.52,shadow:activeBiome==='影晶地',night:isNight(),day}))}notice(boss?'星核守卫出现了。':'周围有新的暗影积木活动。')}
function gain(item,n){addInventory(player.inv,item,n)}
function drop(x,y,item,n){for(let i=0;i<n;i++)pickups.push({x,y,vx:(Math.random()-.5)*4,vy:-3-Math.random()*2,item,life:1200})}
function burst(x,y,color,n){for(let i=0;i<n;i++)particles.push({x,y,vx:(Math.random()-.5)*5,vy:(Math.random()-.8)*5,life:28+Math.random()*18,color})}
function notice(text){clearTimeout(toastTimer);toast.textContent=text;toast.classList.add('show');toastTimer=setTimeout(()=>toast.classList.remove('show'),2200)}
function damageEnemy(e,dmg,knock){const result=damageEnemyState(e,dmg,knock);if(!result.hit)return;burst(e.x+e.w/2,e.y+e.h/2,'#ffcc66',8);if(result.reward){player.score+=result.reward.score;drop(e.x+e.w/2,e.y+e.h/2,result.reward.drop,1);player.energy=clamp(player.energy+result.reward.energy,0,100);burst(e.x+e.w/2,e.y+e.h/2,'#fb7185',18)}}
function attack(){const result=startAttack(player);if(result.kind==='none')return;if(result.kind==='projectile')projectiles.push(result.projectile);if(result.kind==='melee')enemies.forEach(e=>{if(attackHits(result.box,e))damageEnemy(e,result.damage,result.knock)});burst(result.effect.x,result.effect.y,result.effect.color,result.effect.count)}
function openChest(tx,ty){const key=tx+','+ty;if(openedChests.has(key))return;openedChests.add(key);setTile(tx,ty,0);gain('wood',8);gain('torch',4);gain('copper',5);gain('crystal',2);burst(tx*T+T/2,ty*T+T/2,'#ffd34f',18);notice('宝箱开启：获得木材、火把、铜矿和晶片。')}
function nearNpc(){return Math.abs(player.x-npc.x)<70&&Math.abs(player.y-npc.y)<60}
function talkNpc(){npc.talk=180;healPlayer(player);notice('蓝图师：先修基地，再进洞，最后点亮星核门。')}
function useWorkstation(tile){if(tile===20){craftFirstReady();notice('工作台：自动合成当前可用蓝图。')}if(tile===21){gain('brick',3);notice('熔炉：把边角料烧成 3 块砖。')}if(tile===22){player.flags.sword2=true;notice('铁砧：铜剑校准完成。')}}
function activateShrine(){if(player.flags.bossReady&&!bossSpawned){bossSpawned=true;spawnPack(1,true);notice('星核门开启，Boss 已苏醒。')}else notice('星核门需要先合成星核祭坛。')}
function useTool(){const aim=screenToWorld(pointer.x,pointer.y),fallback={x:player.x+player.face*58+player.w/2,y:player.y+20},target=pointer.down?aim:fallback,tx=Math.floor(target.x/T),ty=Math.floor(target.y/T),dist=Math.hypot(tx*T+T/2-player.x,ty*T+T/2-player.y);if(nearNpc()&&!pointer.down){talkNpc();return}if(dist>160)return;const current=tileAt(tx,ty);if(current===14){openChest(tx,ty);return}if(current===18){activateShrine();return}if(current===20||current===21||current===22){useWorkstation(current);return}if(player.tool==='block'||player.tool==='torch'){const build=findBuildItem(player.tool==='torch'?'torch':selectedBuild),placed={x:tx*T,y:ty*T,w:T,h:T},result=placementResult({currentTile:current,inventory:player.inv,build,placed,player});if(result.allowed){setTile(tx,ty,build.tile);player.inv[build.id]--;burst(tx*T+T/2,ty*T+T/2,build.color,build.id==='torch'?8:6);updateHud()}else if(result.reason==='missing'){notice('缺少材料：'+itemNames[build.id])}return}if((player.tool==='pick'||pointer.down)&&current){const key=tx+','+ty,work=mineTarget&&mineTarget.key===key?mineTarget.work:0,hit=miningHit(current,work,player.flags.pick2?1.45:1);if(!hit.allowed)return;mineTarget={key,work:hit.work};burst(tx*T+T/2,ty*T+T/2,current===4?'#f59e5b':'#b98a58',3);if(hit.complete){drop(tx*T+T/2,ty*T+T/2,hit.drop,hit.amount);setTile(tx,ty,0);mineTarget=null;burst(tx*T+T/2,ty*T+T/2,current===10?'#facc15':current===9?'#cbd5e1':current===4?'#fb923c':'#b98a58',12)}}}
function overlap(a,b){return rectsOverlap(a,b)}
function isNight(){return timeOfDay<6||timeOfDay>18.5}
function canCraft(r){return canCraftState(r,player.inv,player.flags)}
function craft(r){if(!applyRecipe(r,player.inv,player.flags))return;notice('合成完成：'+r.name);updateHud()}
function craftFirstReady(){const r=recipes.find(canCraft);if(r)craft(r)}
function saveProgress(){saveSandboxState(localStorage,createSaveSnapshot({inventory:player.inv,flags:player.flags,day,opened:openedChests,selectedBuild,edits:worldEdits}))}
function loadProgress(){const saved=loadSandboxState(localStorage);if(!saved)return;Object.assign(player.inv,saved.inv);Object.assign(player.flags,saved.flags);day=Math.max(day,saved.day);openedChests=new Set(saved.opened);selectedBuild=saved.selectedBuild;saved.edits.forEach(([x,y,tile])=>{if(world[y]&&x>=0&&x<WORLD_W){world[y][x]=tile;worldEdits.set(x+','+y,tile)}})}
function update(dt){
  if(gameOver)return;timeOfDay+=dt*.006;if(timeOfDay>=24){timeOfDay-=24;day++;notice('第 '+day+' 天，世界刷新了。')}
  applyMovementIntent(player,movementIntent(keys),onLadder(player));
  keys.jump=false;

function drawPlayer(){if(player.iframes&&Math.floor(performance.now()/80)%2)return;const x=player.x-2,y=player.y-1;drawMiniHero(x,y,player.face,{skin:'#f7c27a',skinShadow:'#d99155',cheek:'#f59e8b',hair:'#3a2618',hairDark:'#20140d',hairHi:'#6b4528',coat:'#2563eb',coatDark:'#1d4ed8',shirt:'#60a5fa',shirtHi:'#93c5fd',pants:'#312e81',boot:'#111827',sole:'#1f2937',arm:'#f7c27a',armDark:'#1d4ed8',belt:'#7c2d12',buckle:'#fbbf24',cape:'#7c3aed',capeDark:'#4c1d95'});
  const wx=player.face>0?x+25:x-30,wy=y+20,weaponLong=player.flags.sword2?38:27;if(player.tool==='blaster'){px(wx-5,wy-7,44,20,'rgba(125,211,252,.28)');px(wx,wy,31,7,'#67e8f9');px(wx+22,wy-3,12,13,'#0e7490');px(wx+5,wy+2,10,2,'#ecfeff')}else{px(wx-5,wy-7,weaponLong+18,19,'rgba(255,211,79,.25)');px(wx,wy,weaponLong,5,'#ffd34f');px(wx+weaponLong-6,wy-3,10,11,'#f59e0b');px(wx+6,wy-1,11,2,'#fff7cc')}if(player.flags.pick2){px(x+8,y+39,16,4,'#cbd5e1');px(x+18,y+35,5,8,'#94a3b8')}if(player.cool>7&&player.tool==='sword'){ctx.strokeStyle='rgba(255,211,79,.88)';ctx.lineWidth=6;ctx.beginPath();ctx.arc(x+14,y+21,49,player.face>0?-.72:Math.PI-.72,player.face>0?.72:Math.PI+.72);ctx.stroke()}}
function drawNpc(){const x=npc.x-2,y=npc.y;if(npc.talk>0)npc.talk--;drawMiniHero(x,y,1,{phase:1.8,skin:'#f6c47c',skinShadow:'#c9864e',cheek:'#f6a56f',hair:'#475569',hairDark:'#273444',hairHi:'#94a3b8',coat:'#0f766e',coatDark:'#115e59',shirt:'#5eead4',shirtHi:'#99f6e4',pants:'#164e63',boot:'#1e293b',sole:'#334155',arm:'#f6c47c',armDark:'#0f766e',belt:'#78350f',buckle:'#facc15'});px(x-6,y+20,16,5,'#facc15');px(x-7,y+17,5,11,'#b45309');if(npc.talk>0||nearNpc()){px(x-19,y-25,66,18,'rgba(15,18,28,.9)');px(x-12,y-19,52,5,'#ffd34f');px(x+36,y-30,6,10,'#ffd34f')}}
function drawEnemy(e){const x=e.x,y=e.y,blink=Math.sin(performance.now()*.008+e.x*.03)>.7;if(e.boss){ctx.fillStyle='rgba(168,85,247,.3)';ctx.fillRect(x-26,y-24,e.w+52,e.h+44);ctx.fillStyle=e.hit?'#ffd1dc':'#171126';ctx.fillRect(x+10,y+18,e.w-20,e.h-12);ctx.fillStyle='#2e1a4d';ctx.fillRect(x+2,y+8,e.w-4,34);ctx.fillStyle='#4c1d95';ctx.fillRect(x+16,y-2,e.w-32,24);ctx.fillStyle='#0f0b18';ctx.fillRect(x-10,y+38,18,20);ctx.fillRect(x+e.w-8,y+38,18,20);ctx.fillStyle='#a855f7';ctx.fillRect(x+e.w/2-14,y+29,28,26);ctx.fillStyle='#f0abfc';ctx.fillRect(x+22,y+20,8,8);ctx.fillRect(x+e.w-30,y+20,8,8);ctx.fillStyle='#c084fc';ctx.fillRect(x+e.w/2-4,y-14,8,18);ctx.fillRect(x+e.w/2-20,y-8,10,10);ctx.fillRect(x+e.w/2+10,y-8,10,10);ctx.fillStyle='#251827';ctx.fillRect(x,y-12,e.w,5);ctx.fillStyle='#facc15';ctx.fillRect(x,y-12,e.w*clamp(e.hp/e.max,0,1),5);return}
  ctx.fillStyle='rgba(124,58,237,.22)';ctx.fillRect(x-10,y-5,e.w+20,e.h+16);ctx.fillStyle=e.hit?'#ffd1dc':(e.type>=2?'#31174f':'#21182f');ctx.fillRect(x+2,y+8,e.w-4,e.h-8);ctx.fillStyle=e.type>=2?'#4c1d95':'#3b2a55';ctx.fillRect(x+5,y,e.w-10,16);ctx.fillStyle='#120c1d';ctx.fillRect(x-3,y+20,7,17);ctx.fillRect(x+e.w-4,y+20,7,17);ctx.fillRect(x+5,y+e.h-2,e.w-10,7);ctx.fillStyle=e.type===1?'#fb7185':'#a78bfa';ctx.fillRect(x+7,y-4,e.w-14,5);ctx.fillRect(x+11,y-9,5,8);ctx.fillRect(x+e.w-16,y-9,5,8);ctx.fillStyle='#060610';ctx.fillRect(x+7,y+14,5,5);ctx.fillRect(x+17,y+14,5,5);ctx.fillStyle=blink?'#fef3c7':'#c084fc';ctx.fillRect(x+8,y+15,3,3);ctx.fillRect(x+18,y+15,3,3);if(e.type>=2){ctx.fillStyle='#c084fc';ctx.fillRect(x+e.w-2,y+21,15,4);ctx.fillRect(x+e.w+9,y+18,4,10)}ctx.fillStyle='#251827';ctx.fillRect(x,y-10,e.w,4);ctx.fillStyle='#fb7185';ctx.fillRect(x,y-10,e.w*clamp(e.hp/e.max,0,1),4)}
function drawProjectile(p){ctx.fillStyle='#e0f7ff';ctx.fillRect(p.x-6,p.y-3,12,6);ctx.fillStyle='rgba(125,211,252,.42)';ctx.fillRect(p.x-p.vx*1.4,p.y-2,Math.abs(p.vx)*1.4,4)}
function drawParticle(p){ctx.globalAlpha=clamp(p.life/36,0,1);ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,4,4);ctx.globalAlpha=1}
function drawPickup(p){ctx.fillStyle=p.item==='gold'?'#fde047':p.item==='crystal'?'#a78bfa':p.item==='star'?'#fef3c7':'#6ee7b7';ctx.fillRect(p.x-5,p.y-5,10,10);ctx.fillStyle='rgba(255,255,255,.45)';ctx.fillRect(p.x-2,p.y-8,4,4)}
function drawAim(){const pos=screenToWorld(pointer.x,pointer.y),tx=Math.floor(pos.x/T),ty=Math.floor(pos.y/T);ctx.strokeStyle='rgba(255,255,255,.75)';ctx.lineWidth=2;ctx.strokeRect(tx*T+2,ty*T+2,T-4,T-4);if(mineTarget){const parts=mineTarget.key.split(',').map(Number),progress=clamp(mineTarget.work/(hard[tileAt(parts[0],parts[1])]||1),0,1);ctx.fillStyle='rgba(255,211,79,.8)';ctx.fillRect(parts[0]*T+4,parts[1]*T+26,(T-8)*progress,3)}}
function drawMinimap(){mctx.clearRect(0,0,minimap.width,minimap.height);mctx.fillStyle='rgba(8,11,18,.82)';mctx.fillRect(0,0,minimap.width,minimap.height);const sx=minimap.width/WORLD_W,sy=minimap.height/WORLD_H;for(let y=0;y<WORLD_H;y+=2)for(let x=0;x<WORLD_W;x+=2){const t=tileAt(x,y);if(!t)continue;mctx.fillStyle=t===16?'#2dd4bf':t===17?'#fb923c':t===18?'#c084fc':t===20?'#fbbf24':t===21?'#f97316':t===22?'#cbd5e1':t===11?'#7c3aed':t===10?'#facc15':t===9?'#cbd5e1':t===4?'#fb923c':t===12?'#d8b871':t===1?'#65a30d':'#64748b';mctx.fillRect(x*sx,y*sy,Math.max(1,sx*2),Math.max(1,sy*2))}mctx.fillStyle='#60a5fa';mctx.fillRect(player.x/T*sx-2,player.y/T*sy-2,4,4);mctx.fillStyle='#6ee7b7';mctx.fillRect(npc.x/T*sx-2,npc.y/T*sy-2,4,4);mctx.fillStyle='#ffd34f';mctx.fillRect(core.x/T*sx-2,core.y/T*sy-2,4,4);mctx.strokeStyle='rgba(255,255,255,.55)';mctx.strokeRect(camera.x/T*sx,camera.y/T*sy,innerWidth/T*sx,innerHeight/T*sy)}
function drawLightVeil(vw,vh){const depth=clamp((camera.y-680)/1600,0,.58);if(depth){ctx.fillStyle='rgba(5,8,14,'+depth+')';ctx.fillRect(0,0,vw,vh)}if(activeBiome==='影晶地'){ctx.fillStyle='rgba(65,25,105,.16)';ctx.fillRect(0,0,vw,vh)}const gx=core.x-camera.x,gy=core.y-camera.y;ctx.fillStyle='rgba(255,203,96,.12)';ctx.fillRect(gx-150,gy-125,300,230);enemies.forEach(e=>{if(e.type>=2||e.boss){ctx.fillStyle=e.boss?'rgba(168,85,247,.18)':'rgba(124,58,237,.12)';ctx.fillRect(e.x-camera.x-46,e.y-camera.y-38,e.w+92,e.h+76)}})}
function draw(){const vw=innerWidth,vh=innerHeight;ctx.clearRect(0,0,vw,vh);const sx=camera.shake?Math.sin(performance.now()*.06)*camera.shake:0,sy=camera.shake?Math.cos(performance.now()*.05)*camera.shake:0;drawSky(vw,vh);drawAmbientSprites(vw);ctx.save();ctx.translate(-Math.floor(camera.x)+sx,-Math.floor(camera.y)+sy);drawCaveBackdrops();drawBossSet();drawBaseInterior();drawWorld();drawSurfaceDecor();drawCore();projectiles.forEach(drawProjectile);pickups.forEach(drawPickup);enemies.forEach(drawEnemy);drawNpc();drawPlayer();particles.forEach(drawParticle);drawAim();ctx.restore();drawLightVeil(vw,vh);drawMinimap()}
function loop(now){const dt=Math.min(33,now-lastTime);lastTime=now;update(dt/16.67);draw();requestAnimationFrame(loop)}
function syncTools(){document.querySelectorAll('[data-tool]').forEach(btn=>btn.classList.toggle('active',btn.dataset.tool===player.tool))}
document.querySelectorAll('[data-tool]').forEach(btn=>btn.addEventListener('click',()=>{player.tool=btn.dataset.tool;syncTools()}));
bagToggle.addEventListener('click',()=>setBagCollapsed(!bagPanel.classList.contains('collapsed')));
window.addEventListener('resize',syncBagForViewport,{passive:true});
craftGrid.addEventListener('click',e=>{const btn=e.target.closest('[data-craft]');if(!btn)return;const r=recipes.find(x=>x.id===btn.dataset.craft);if(r)craft(r)});
buildPalette.addEventListener('click',e=>{const btn=e.target.closest('[data-build]');if(!btn)return;selectedBuild=btn.dataset.build;player.tool=selectedBuild==='torch'?'torch':'block';syncTools();updateHud()});
bindGameInput({win:window,canvas,state:keys,holdButtons:document.querySelectorAll('[data-hold]'),tapButtons:document.querySelectorAll('[data-tap]'),getPointer:()=>pointer,getTool:()=>player.tool,setTool:tool=>{player.tool=tool},syncTools,onPrimary:tool=>{if(tool==='sword'||tool==='blaster')attack();else useTool()},onMineEnd:()=>{mineTarget=null}});
restartBtn.addEventListener('click',reset);syncBagForViewport();reset();requestAnimationFrame(loop);
})();
</script>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>沐沐积木沙盒战场</title>
<style>
:root{
  --ink:#141318;
  --panel:rgba(22,24,32,.78);
  --panel-strong:rgba(22,24,32,.92);
  --line:rgba(255,255,255,.16);
  --gold:#ffd34f;
  --mint:#6ee7b7;
  --rose:#fb7185;
  --sky:#7dd3fc;
  --white:#fff7df;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:#15151b;color:var(--white);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{touch-action:none}
.game-shell{position:fixed;inset:0;background:linear-gradient(#77bdf2 0%,#b7e7ff 34%,#5d9660 34%,#3c6948 100%);isolation:isolate}
#gameCanvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;display:block}
.topbar{position:absolute;top:max(12px,env(safe-area-inset-top));left:12px;right:12px;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;z-index:5;pointer-events:none}
.back-link,.pill,.icon-btn{pointer-events:auto;border:1px solid var(--line);background:var(--panel);color:var(--white);box-shadow:0 10px 28px rgba(0,0,0,.22);backdrop-filter:blur(14px)}
.back-link{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 13px;border-radius:8px;text-decoration:none;font-weight:800}
.title-card{justify-self:start;min-width:0;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);box-shadow:0 10px 28px rgba(0,0,0,.22);backdrop-filter:blur(14px)}
.title-card h1{margin:0;font-size:17px;line-height:1.1;letter-spacing:0}
.title-card p{margin:4px 0 0;color:#d8eaff;font-size:12px;font-weight:700}
.status-grid{display:grid;grid-template-columns:repeat(4,minmax(70px,auto));gap:6px;justify-content:end}
.pill{min-height:40px;padding:7px 10px;border-radius:8px;font-weight:900;font-size:12px;line-height:1.15}
.pill strong{display:block;font-size:16px;color:var(--gold)}
.toolbelt{position:absolute;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:8px;z-index:6;padding:8px;border:1px solid var(--line);border-radius:10px;background:var(--panel-strong);box-shadow:0 14px 34px rgba(0,0,0,.3);backdrop-filter:blur(14px)}
.icon-btn{width:48px;height:48px;border-radius:8px;font-size:22px;font-weight:900;display:grid;place-items:center;cursor:pointer}
.icon-btn.active{outline:2px solid var(--gold);background:rgba(255,211,79,.18)}
.icon-btn:active{transform:translateY(1px)}
.mobile-pad{position:absolute;inset:auto 12px max(14px,env(safe-area-inset-bottom)) 12px;display:none;grid-template-columns:max-content max-content;justify-content:space-between;align-items:end;gap:12px;z-index:6;pointer-events:none}
.pad-group{display:grid;grid-template-columns:repeat(3,54px);grid-auto-rows:54px;gap:8px;pointer-events:auto}
.pad-group.actions{grid-template-columns:repeat(2,56px)}
.pad-btn{border:1px solid var(--line);border-radius:10px;background:var(--panel-strong);color:var(--white);font-size:22px;font-weight:900;box-shadow:0 12px 28px rgba(0,0,0,.28)}
.pad-btn:active{background:rgba(255,211,79,.2)}
.toast{position:absolute;left:50%;top:86px;transform:translateX(-50%);max-width:min(560px,calc(100vw - 28px));padding:10px 14px;border:1px solid var(--line);border-radius:8px;background:rgba(19,21,28,.88);box-shadow:0 14px 34px rgba(0,0,0,.28);font-weight:800;text-align:center;opacity:0;transition:opacity .2s,transform .2s;z-index:9;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(4px)}
.overlay{position:absolute;inset:0;display:none;place-items:center;z-index:10;background:rgba(10,12,18,.52);backdrop-filter:blur(6px)}
.overlay.show{display:grid}
.modal{width:min(460px,calc(100vw - 28px));padding:22px;border:1px solid var(--line);border-radius:10px;background:rgba(24,27,36,.94);box-shadow:0 22px 60px rgba(0,0,0,.4);text-align:center}
.modal h2{margin:0 0 8px;font-size:26px;letter-spacing:0}
.modal p{margin:0 0 18px;color:#d7e7ff;font-weight:700}
.modal button{min-height:44px;padding:0 18px;border:0;border-radius:8px;background:var(--gold);color:#2d2200;font-weight:950;cursor:pointer}
@media (max-width:860px){
  .topbar{grid-template-columns:1fr;right:auto;max-width:calc(100vw - 24px)}
  .status-grid{grid-template-columns:repeat(2,minmax(74px,1fr));justify-content:start}
  .title-card h1{font-size:15px}
  .toolbelt{bottom:92px;gap:6px;padding:6px}
  .icon-btn{width:42px;height:42px;font-size:19px}
  .mobile-pad{display:block;right:auto;width:min(366px,calc(100vw - 24px));height:54px}
  .mobile-pad .pad-group{position:absolute;left:0;bottom:0;display:flex;width:160px}
  .mobile-pad .pad-group.actions{left:auto;right:0}
  .back-link{width:max-content}
}
@media (max-width:520px){
  .topbar{gap:7px}
  .title-card p{display:none}
  .pill{font-size:11px;min-height:36px;padding:6px 8px}
  .pill strong{font-size:14px}
  .pad-group{grid-template-columns:repeat(3,48px);grid-auto-rows:48px}
  .mobile-pad .pad-group.actions{width:108px}
  .pad-group.actions{grid-template-columns:repeat(2,50px)}
  .pad-btn{width:48px;height:48px}
  .pad-group.actions .pad-btn{width:50px}
}
</style>
</head>
<body>
<main class="game-shell" aria-label="沐沐积木沙盒战场">
  <canvas id="gameCanvas" width="1280" height="720"></canvas>
  <div class="topbar">
    <a class="back-link" href="./" aria-label="返回武器库">← 武器库</a>
    <section class="title-card" aria-label="游戏标题">
      <h1>沐沐积木沙盒战场</h1>
      <p>横版挖掘、搭建、守住水晶核心</p>
    </section>
    <section class="status-grid" aria-label="战场状态">
      <div class="pill">生命<strong id="hpText">100</strong></div>
      <div class="pill">能量<strong id="energyText">100</strong></div>
      <div class="pill">波次<strong id="waveText">1</strong></div>
      <div class="pill">材料<strong id="bagText">0</strong></div>
    </section>
  </div>
  <nav class="toolbelt" aria-label="工具栏">
    <button class="icon-btn active" type="button" data-tool="sword" title="近战">⚔</button>
    <button class="icon-btn" type="button" data-tool="blaster" title="远程">✦</button>
    <button class="icon-btn" type="button" data-tool="pick" title="挖掘">⛏</button>
    <button class="icon-btn" type="button" data-tool="block" title="放置">▣</button>
    <button class="icon-btn" type="button" data-tool="torch" title="照明">◆</button>
  </nav>
  <div class="mobile-pad" aria-hidden="false">
    <div class="pad-group">
      <button class="pad-btn" data-hold="left" type="button" aria-label="左">◀</button>
      <button class="pad-btn" data-tap="jump" type="button" aria-label="跳">▲</button>
      <button class="pad-btn" data-hold="right" type="button" aria-label="右">▶</button>
    </div>
    <div class="pad-group actions">
      <button class="pad-btn" data-tap="attack" type="button" aria-label="攻击">⚔</button>
      <button class="pad-btn" data-tap="use" type="button" aria-label="使用">⛏</button>
    </div>
  </div>
  <div class="toast" id="toast"></div>
  <div class="overlay" id="endOverlay">
    <div class="modal">
      <h2 id="endTitle">战斗结束</h2>
      <p id="endCopy">水晶核心等待下一轮修复。</p>
      <button type="button" id="restartBtn">重新开战</button>
    </div>
  </div>
</main>
<script>
(()=>{
  const canvas=document.getElementById('gameCanvas');
  const ctx=canvas.getContext('2d');
  const hpText=document.getElementById('hpText');
  const energyText=document.getElementById('energyText');
  const waveText=document.getElementById('waveText');
  const bagText=document.getElementById('bagText');
  const toast=document.getElementById('toast');
  const endOverlay=document.getElementById('endOverlay');
  const endTitle=document.getElementById('endTitle');
  const endCopy=document.getElementById('endCopy');
  const restartBtn=document.getElementById('restartBtn');
  const W=1280,H=720,T=32,WORLD_W=190,WORLD_H=58;
  const GRAVITY=.72,MAX_FALL=17;
  const tileNames=['air','grass','dirt','stone','ore','core','torch'];
  const solidTiles=new Set([1,2,3,4,5]);
  const tileColors={1:['#5caa59','#36713d'],2:['#8a5a36','#62391f'],3:['#68717c','#424954'],4:['#5b6681','#61d8ff'],5:['#ffe07a','#ff8a4f'],6:['#ffef99','#ffb84d']};
  let world,player,camera,enemies,projectiles,particles,wave,spawnTimer,gameOver,pointer,keys,lastTime,toastTimer,core;

  function resize(){
    const dpr=Math.min(2,window.devicePixelRatio||1);
    canvas.width=Math.floor(innerWidth*dpr);
    canvas.height=Math.floor(innerHeight*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  window.addEventListener('resize',resize,{passive:true});
  resize();

  function rand(seed){
    let t=seed+0x6D2B79F5;
    return ()=>{t+=0x6D2B79F5;let r=Math.imul(t^t>>>15,1|t);r^=r+Math.imul(r^r>>>7,61|r);return ((r^r>>>14)>>>0)/4294967296;};
  }

  function buildWorld(){
    const rnd=rand(5312026);
    const map=Array.from({length:WORLD_H},()=>Array(WORLD_W).fill(0));
    for(let x=0;x<WORLD_W;x++){
      const surface=19+Math.floor(Math.sin(x*.12)*3+Math.sin(x*.033)*5+rnd()*2);
      for(let y=surface;y<WORLD_H;y++){
        let tile=y===surface?1:y<surface+5?2:3;
        if(y>surface+9&&rnd()<.075)tile=4;
        if(y>surface+7&&rnd()<.055)tile=0;
        if(y>surface+13&&rnd()<.04)tile=0;
        map[y][x]=tile;
      }
    }
    const cx=18,cy=16;
    for(let y=cy-4;y<=cy+4;y++){
      for(let x=cx-5;x<=cx+5;x++){
        if(map[y])map[y][x]=0;
      }
    }
    for(let x=cx-4;x<=cx+4;x++)map[cy+4][x]=3;
    map[cy+3][cx]=5;
    map[cy+2][cx]=5;
    map[cy+1][cx]=6;
    return {map,core:{x:cx*T,y:(cy+2)*T,hp:180,max:180}};
  }

  function reset(){
    const built=buildWorld();
    world=built.map;
    core=built.core;
    player={x:12*T,y:11*T,w:24,h:42,vx:0,vy:0,face:1,onGround:false,hp:100,energy:100,tool:'sword',cool:0,iframes:0,inv:{dirt:28,stone:12,ore:0,torch:5},score:0};
    camera={x:0,y:0,shake:0};
    enemies=[];
    projectiles=[];
    particles=[];
    wave=1;
    spawnTimer=0;
    gameOver=false;
    pointer={x:innerWidth/2,y:innerHeight/2,down:false,button:0};
    keys={};
    lastTime=performance.now();
    endOverlay.classList.remove('show');
    spawnWave();
    notice('守住水晶核心，战场已经展开。');
  }

  function tileAt(tx,ty){return world[ty]&&world[ty][tx]||0}
  function setTile(tx,ty,v){if(world[ty]&&tx>=0&&tx<WORLD_W)world[ty][tx]=v}
  function isSolidAt(px,py){return solidTiles.has(tileAt(Math.floor(px/T),Math.floor(py/T)))}
  function rectHits(x,y,w,h){
    return isSolidAt(x,y)||isSolidAt(x+w,y)||isSolidAt(x,y+h)||isSolidAt(x+w,y+h);
  }
  function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
  function screenToWorld(x,y){return {x:x+camera.x,y:y+camera.y}}

  function moveEntity(e){
    e.vy=clamp(e.vy+GRAVITY,-30,MAX_FALL);
    e.x+=e.vx;
    if(rectHits(e.x,e.y,e.w,e.h)){
      const step=Math.sign(e.vx)||1;
      while(rectHits(e.x,e.y,e.w,e.h))e.x-=step;
      e.vx=0;
    }
    e.y+=e.vy;
    e.onGround=false;
    if(rectHits(e.x,e.y,e.w,e.h)){
      const step=Math.sign(e.vy)||1;
      while(rectHits(e.x,e.y,e.w,e.h))e.y-=step;
      if(step>0)e.onGround=true;
      e.vy=0;
    }
  }

  function spawnWave(){
    const count=Math.min(10,3+wave);
    for(let i=0;i<count;i++){
      const side=i%2?-1:1;
      const x=clamp(player.x+side*(520+i*60),T*5,T*(WORLD_W-8));
      const y=findSurface(Math.floor(x/T))*T-44;
      enemies.push({x,y,w:28,h:34,vx:0,vy:0,hp:34+wave*8,max:34+wave*8,hit:0,type:i%3});
    }
    notice('第 '+wave+' 波暗影积木靠近核心。');
  }

  function findSurface(tx){
    for(let y=0;y<WORLD_H;y++)if(solidTiles.has(tileAt(tx,y)))return y;
    return WORLD_H-2;
  }

  function damageEnemy(e,dmg,knock){
    e.hp-=dmg;
    e.hit=10;
    e.vx+=knock;
    burst(e.x+e.w/2,e.y+e.h/2,'#ffcc66',8);
    if(e.hp<=0){
      player.score+=10;
      player.inv.ore+=e.type===2?1:0;
      player.energy=clamp(player.energy+10,0,100);
      burst(e.x+e.w/2,e.y+e.h/2,'#fb7185',18);
    }
  }

  function attack(){
    if(player.cool>0)return;
    player.cool=player.tool==='blaster'?18:14;
    if(player.tool==='blaster'&&player.energy>=8){
      player.energy-=8;
      projectiles.push({x:player.x+player.w/2+player.face*18,y:player.y+18,vx:player.face*13,vy:-.4,life:70,from:'player'});
      burst(player.x+player.w/2+player.face*22,player.y+18,'#7dd3fc',6);
      return;
    }
    const ax=player.face>0?player.x+player.w:player.x-56;
    const ay=player.y-6;
    enemies.forEach(e=>{
      if(e.hp>0&&ax<e.x+e.w&&ax+56>e.x&&ay<e.y+e.h&&ay+58>e.y)damageEnemy(e,18+wave,player.face*4.5);
    });
    burst(player.x+player.w/2+player.face*34,player.y+18,'#ffd34f',10);
  }

  function useTool(){
    const aim=screenToWorld(pointer.x,pointer.y);
    const fallback={x:player.x+player.face*58+player.w/2,y:player.y+20};
    const target=pointer.down?aim:fallback;
    const tx=Math.floor(target.x/T),ty=Math.floor(target.y/T);
    const dist=Math.hypot(tx*T+T/2-player.x,ty*T+T/2-player.y);
    if(dist>150)return;
    const current=tileAt(tx,ty);
    if(player.tool==='block'){
      if(!current&&player.inv.dirt>0&&!rectHits(tx*T,ty*T,T,T)){
        setTile(tx,ty,2);
        player.inv.dirt--;
        burst(tx*T+T/2,ty*T+T/2,'#8a5a36',6);
      }
      return;
    }
    if(player.tool==='torch'){
      if(!current&&player.inv.torch>0){
        setTile(tx,ty,6);
        player.inv.torch--;
        burst(tx*T+T/2,ty*T+T/2,'#ffef99',8);
      }
      return;
    }
    if((player.tool==='pick'||pointer.down)&&current&&current!==5){
      const gain=current===4?'ore':current===3?'stone':'dirt';
      player.inv[gain]++;
      setTile(tx,ty,0);
      burst(tx*T+T/2,ty*T+T/2,current===4?'#61d8ff':'#b98a58',12);
    }
  }

  function burst(x,y,color,n){
    for(let i=0;i<n;i++)particles.push({x,y,vx:(Math.random()-.5)*5,vy:(Math.random()-.8)*5,life:28+Math.random()*18,color});
  }

  function notice(text){
    clearTimeout(toastTimer);
    toast.textContent=text;
    toast.classList.add('show');
    toastTimer=setTimeout(()=>toast.classList.remove('show'),2100);
  }

  function update(dt){
    if(gameOver)return;
    const left=keys.ArrowLeft||keys.KeyA||keys.left;
    const right=keys.ArrowRight||keys.KeyD||keys.right;
    const jump=keys.Space||keys.ArrowUp||keys.KeyW||keys.jump;
    player.vx=(right?1:0)-(left?1:0);
    player.vx*=5.2;
    if(player.vx)player.face=Math.sign(player.vx);
    if(jump&&player.onGround){player.vy=-13.2;player.onGround=false}
    if(keys.KeyJ||keys.attack){attack();keys.attack=false}
    if(keys.KeyK){player.tool='blaster';syncTools();attack()}
    if(keys.use){useTool();keys.use=false}
    if(pointer.down)(player.tool==='sword'||player.tool==='blaster'?attack():useTool());
    player.energy=clamp(player.energy+.075,0,100);
    player.cool=Math.max(0,player.cool-1);
    player.iframes=Math.max(0,player.iframes-1);
    moveEntity(player);
    if(player.y>WORLD_H*T)player.hp=0;

    enemies.forEach(e=>{
      if(e.hp<=0)return;
      const target=Math.abs(e.x-core.x)<Math.abs(e.x-player.x)?core:player;
      const dir=Math.sign((target.x||player.x)-e.x)||1;
      e.vx=dir*(1.2+wave*.08+e.type*.18);
      if(e.onGround&&Math.random()<.012)e.vy=-9;
      moveEntity(e);
      e.hit=Math.max(0,e.hit-1);
      if(overlap(e,player)&&player.iframes<=0){
        player.hp-=8+wave;
        player.iframes=45;
        player.vx+=dir*5;
        camera.shake=9;
        burst(player.x+player.w/2,player.y+20,'#fb7185',8);
      }
      if(Math.abs(e.x-core.x)<36&&Math.abs(e.y-core.y)<70){
        core.hp-=.18+wave*.03;
        e.vx*=-1;
        camera.shake=Math.max(camera.shake,3);
      }
    });
    enemies=enemies.filter(e=>e.hp>0);
    projectiles.forEach(p=>{
      p.x+=p.vx;p.y+=p.vy;p.vy+=.02;p.life--;
      enemies.forEach(e=>{
        if(e.hp>0&&p.x>e.x&&p.x<e.x+e.w&&p.y>e.y&&p.y<e.y+e.h){damageEnemy(e,22+wave,p.vx*.22);p.life=0}
      });
      if(isSolidAt(p.x,p.y)){burst(p.x,p.y,'#7dd3fc',8);p.life=0}
    });
    projectiles=projectiles.filter(p=>p.life>0);
    particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.18;p.life--});
    particles=particles.filter(p=>p.life>0);
    if(!enemies.length){
      spawnTimer++;
      if(spawnTimer>120){wave++;spawnTimer=0;spawnWave()}
    }
    camera.x=clamp(player.x-innerWidth*.48,0,WORLD_W*T-innerWidth);
    camera.y=clamp(player.y-innerHeight*.48,0,WORLD_H*T-innerHeight);
    if(camera.shake>0)camera.shake*=.86;
    if(player.hp<=0||core.hp<=0)end(false);
    if(wave>6)end(true);
    updateHud();
  }

  function overlap(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}

  function end(win){
    gameOver=true;
    endTitle.textContent=win?'水晶核心稳住了':'战场需要重建';
    endCopy.textContent=win?'沐沐的积木防线撑过了 6 波进攻。':'修好地形、换一把武器，再打一轮。';
    endOverlay.classList.add('show');
  }

  function updateHud(){
    hpText.textContent=Math.max(0,Math.round(player.hp));
    energyText.textContent=Math.round(player.energy);
    waveText.textContent=Math.min(wave,6);
    bagText.textContent=player.inv.dirt+player.inv.stone+player.inv.ore;
  }

  function draw(){
    const vw=innerWidth,vh=innerHeight;
    ctx.clearRect(0,0,vw,vh);
    const sx=(camera.shake?Math.sin(performance.now()*.06)*camera.shake:0);
    const sy=(camera.shake?Math.cos(performance.now()*.05)*camera.shake:0);
    drawSky(vw,vh);
    ctx.save();
    ctx.translate(-Math.floor(camera.x)+sx,-Math.floor(camera.y)+sy);
    drawWorld();
    drawCore();
    projectiles.forEach(drawProjectile);
    enemies.forEach(drawEnemy);
    drawPlayer();
    particles.forEach(drawParticle);
    drawAim();
    ctx.restore();
  }

  function drawSky(vw,vh){
    const g=ctx.createLinearGradient(0,0,0,vh);
    g.addColorStop(0,'#6fb8ef');
    g.addColorStop(.38,'#d4f4ff');
    g.addColorStop(.39,'#6aa765');
    g.addColorStop(1,'#254232');
    ctx.fillStyle=g;ctx.fillRect(0,0,vw,vh);
    ctx.fillStyle='rgba(255,255,255,.52)';
    for(let i=0;i<7;i++){
      const x=(i*260-(camera.x*.18)%260),y=54+(i%3)*38;
      ctx.fillRect(x,y,78,18);ctx.fillRect(x+22,y-12,64,18);ctx.fillRect(x+78,y+5,54,14);
    }
    ctx.fillStyle='rgba(255,232,138,.9)';
    ctx.fillRect(vw-128,58,54,54);
  }

  function drawWorld(){
    const minX=Math.max(0,Math.floor(camera.x/T)-1),maxX=Math.min(WORLD_W-1,Math.ceil((camera.x+innerWidth)/T)+1);
    const minY=Math.max(0,Math.floor(camera.y/T)-1),maxY=Math.min(WORLD_H-1,Math.ceil((camera.y+innerHeight)/T)+1);
    for(let y=minY;y<=maxY;y++){
      for(let x=minX;x<=maxX;x++){
        const t=tileAt(x,y);
        if(!t)continue;
        const px=x*T,py=y*T;
        const c=tileColors[t]||tileColors[2];
        if(t===6){
          ctx.fillStyle='rgba(255,205,84,.22)';ctx.fillRect(px-32,py-32,96,96);
          ctx.fillStyle=c[0];ctx.fillRect(px+12,py+8,8,18);ctx.fillStyle=c[1];ctx.fillRect(px+10,py+5,12,10);
          continue;
        }
        ctx.fillStyle=c[0];ctx.fillRect(px,py,T,T);
        ctx.fillStyle=c[1];ctx.fillRect(px,py+22,T,10);
        ctx.fillStyle='rgba(255,255,255,.12)';ctx.fillRect(px+3,py+3,8,5);
        if(t===4){ctx.fillStyle='#9beafe';ctx.fillRect(px+7,py+10,7,7);ctx.fillRect(px+19,py+17,6,6)}
        if(t===1){ctx.fillStyle='#73d16b';ctx.fillRect(px,py,32,7)}
      }
    }
  }

  function drawCore(){
    const hp=clamp(core.hp/core.max,0,1);
    ctx.fillStyle='rgba(255,168,79,.2)';ctx.fillRect(core.x-42,core.y-54,116,132);
    ctx.fillStyle='#ffcf66';ctx.fillRect(core.x+8,core.y-18,18,62);
    ctx.fillStyle='#f97316';ctx.fillRect(core.x-4,core.y,42,22);
    ctx.fillStyle='#ffe9a3';ctx.fillRect(core.x+3,core.y-33,32,32);
    ctx.fillStyle='#2d1e1a';ctx.fillRect(core.x-16,core.y-52,72,7);
    ctx.fillStyle=hp>.4?'#6ee7b7':'#fb7185';ctx.fillRect(core.x-16,core.y-52,72*hp,7);
  }

  function drawPlayer(){
    const flicker=player.iframes&&Math.floor(performance.now()/80)%2;
    if(flicker)return;
    const x=player.x,y=player.y;
    ctx.fillStyle='#1f2937';ctx.fillRect(x+5,y+34,8,10);ctx.fillRect(x+15,y+34,8,10);
    ctx.fillStyle='#2563eb';ctx.fillRect(x+3,y+15,20,23);
    ctx.fillStyle='#f8c27a';ctx.fillRect(x+4,y+2,19,17);
    ctx.fillStyle='#3b2b1e';ctx.fillRect(x+2,y,23,7);
    ctx.fillStyle='#111827';ctx.fillRect(x+(player.face>0?16:6),y+8,4,4);
    ctx.fillStyle=player.tool==='blaster'?'#7dd3fc':'#ffd34f';
    const wx=player.face>0?x+24:x-20;
    ctx.fillRect(wx,y+18,22,5);
    if(player.cool>7&&player.tool==='sword'){
      ctx.strokeStyle='rgba(255,211,79,.75)';ctx.lineWidth=5;ctx.beginPath();
      ctx.arc(x+12,y+20,46,player.face>0?-.7:Math.PI-.7,player.face>0?.7:Math.PI+.7);
      ctx.stroke();
    }
  }

  function drawEnemy(e){
    const x=e.x,y=e.y;
    ctx.fillStyle=e.hit?'#ffd1dc':(e.type===2?'#53377a':'#3d2d4f');
    ctx.fillRect(x,y+6,e.w,e.h-6);
    ctx.fillStyle=e.type===1?'#fb7185':'#a78bfa';
    ctx.fillRect(x+5,y,e.w-10,12);
    ctx.fillStyle='#101018';ctx.fillRect(x+7,y+14,5,5);ctx.fillRect(x+17,y+14,5,5);
    ctx.fillStyle='#16151d';ctx.fillRect(x+3,y+e.h,e.w-6,5);
    ctx.fillStyle='#251827';ctx.fillRect(x,y-8,e.w,4);
    ctx.fillStyle='#fb7185';ctx.fillRect(x,y-8,e.w*clamp(e.hp/e.max,0,1),4);
  }

  function drawProjectile(p){
    ctx.fillStyle='#e0f7ff';ctx.fillRect(p.x-6,p.y-3,12,6);
    ctx.fillStyle='rgba(125,211,252,.42)';ctx.fillRect(p.x-p.vx*1.4,p.y-2,Math.abs(p.vx)*1.4,4);
  }

  function drawParticle(p){
    ctx.globalAlpha=clamp(p.life/36,0,1);
    ctx.fillStyle=p.color;
    ctx.fillRect(p.x,p.y,4,4);
    ctx.globalAlpha=1;
  }

  function drawAim(){
    const pos=screenToWorld(pointer.x,pointer.y);
    const tx=Math.floor(pos.x/T),ty=Math.floor(pos.y/T);
    ctx.strokeStyle='rgba(255,255,255,.75)';
    ctx.lineWidth=2;
    ctx.strokeRect(tx*T+2,ty*T+2,T-4,T-4);
  }

  function loop(now){
    const dt=Math.min(33,now-lastTime);
    lastTime=now;
    update(dt/16.67);
    draw();
    requestAnimationFrame(loop);
  }

  function syncTools(){
    document.querySelectorAll('[data-tool]').forEach(btn=>btn.classList.toggle('active',btn.dataset.tool===player.tool));
  }
  document.querySelectorAll('[data-tool]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      player.tool=btn.dataset.tool;
      syncTools();
    });
  });
  window.addEventListener('keydown',e=>{
    keys[e.code]=true;
    if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();
    if(e.code==='Digit1')player.tool='sword';
    if(e.code==='Digit2')player.tool='blaster';
    if(e.code==='Digit3')player.tool='pick';
    if(e.code==='Digit4')player.tool='block';
    if(e.code==='Digit5')player.tool='torch';
    syncTools();
  });
  window.addEventListener('keyup',e=>{keys[e.code]=false});
  canvas.addEventListener('pointermove',e=>{pointer.x=e.clientX;pointer.y=e.clientY});
  canvas.addEventListener('pointerdown',e=>{pointer.down=true;pointer.button=e.button;pointer.x=e.clientX;pointer.y=e.clientY;canvas.setPointerCapture(e.pointerId);if(e.button===2)player.tool='block';syncTools();});
  canvas.addEventListener('pointerup',()=>{pointer.down=false});
  canvas.addEventListener('contextmenu',e=>e.preventDefault());
  document.querySelectorAll('[data-hold]').forEach(btn=>{
    const key=btn.dataset.hold;
    btn.addEventListener('pointerdown',()=>{keys[key]=true});
    btn.addEventListener('pointerup',()=>{keys[key]=false});
    btn.addEventListener('pointercancel',()=>{keys[key]=false});
    btn.addEventListener('pointerleave',()=>{keys[key]=false});
  });
  document.querySelectorAll('[data-tap]').forEach(btn=>{
    btn.addEventListener('click',()=>{keys[btn.dataset.tap]=true});
  });
  restartBtn.addEventListener('click',reset);
  reset();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>沐沐积木武器库 · 审核台</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f7f4ec;color:#1f2933}
.wrap{max-width:1180px;margin:0 auto;padding:28px 18px 56px}
.top{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:22px}
h1{margin:0;font-size:clamp(28px,4vw,48px);letter-spacing:0}
.sub{margin-top:8px;color:#667085;font-weight:700}
.panel{background:rgba(255,255,255,.82);border:1px solid rgba(31,41,51,.1);box-shadow:0 18px 50px rgba(31,41,51,.08);border-radius:20px;padding:18px}
.login{display:grid;grid-template-columns:1fr auto;gap:10px;margin-bottom:18px}
.ai-login{display:grid;grid-template-columns:1.1fr .9fr auto;gap:10px;margin-top:10px}
input,textarea,select{width:100%;border:1px solid rgba(31,41,51,.14);border-radius:14px;padding:13px 14px;font:inherit;background:white;outline:none}
textarea{min-height:78px;resize:vertical}
.edit-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.edit-grid label{display:flex;flex-direction:column;gap:5px;color:#667085;font-size:12px;font-weight:900}
.edit-grid input,.edit-grid select{padding:10px 11px;border-radius:12px;font-size:14px;font-weight:850}
button{border:0;border-radius:14px;padding:13px 16px;font:inherit;font-weight:900;cursor:pointer;background:#1f2933;color:white}
button.secondary{background:#edf2f7;color:#1f2933}
button.good{background:#17a36b}
button.bad{background:#e5484d}
button:disabled{opacity:.45;cursor:not-allowed}
.status{color:#667085;font-weight:800;margin:12px 0 0}
.section-title{font-size:24px;font-weight:950;margin:24px 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}
.card{overflow:hidden}
.image{background:#fff;border-radius:18px;aspect-ratio:4/3;display:grid;place-items:center;border:1px solid rgba(31,41,51,.08);overflow:hidden}
.image img{max-width:100%;max-height:100%;object-fit:contain}
.meta{padding:14px 2px 0}
.name{font-size:22px;font-weight:950;margin-bottom:6px}
.line{color:#667085;font-weight:750;margin:4px 0;word-break:break-word}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.chip{background:#edf2f7;border-radius:999px;padding:6px 10px;font-weight:900;font-size:13px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.actions.three{grid-template-columns:1fr 1fr 1fr}
.showcase-tools{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:10px;align-items:center}
.showcase-tools input{padding:10px;border-radius:12px}
.refine-tools{display:grid;grid-template-columns:1fr;gap:10px;margin-top:12px;padding:12px;border:1px solid rgba(31,41,51,.09);border-radius:16px;background:#fffaf0}
.refine-tools .row{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center}
.refine-tools input{padding:10px;border-radius:12px}
.refine-note{color:#8a5b1d;font-size:12px;font-weight:850;line-height:1.55}
.ai-workbench{display:grid;gap:10px;margin-top:12px;padding:12px;border:1px solid rgba(95,73,255,.18);border-radius:16px;background:linear-gradient(135deg,#f6f3ff,#fff8ee)}
.ai-workbench .row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ai-workbench .actions{grid-template-columns:1fr 1fr}
.ai-title{font-weight:950;color:#39257d}
.ai-note{color:#655a7c;font-size:12px;font-weight:850;line-height:1.55}
.ai-assets{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ai-assets figure{margin:0;padding:7px;border:1px solid rgba(95,73,255,.12);border-radius:13px;background:white}
.ai-assets figcaption{font-size:11px;color:#655a7c;font-weight:900;margin-bottom:5px}
.ai-assets img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:10px;background:#f4f0ff}
.image-pair{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.image-pair figure{margin:0;padding:8px;border:1px solid rgba(31,41,51,.08);border-radius:14px;background:#fff}
.image-pair figcaption{font-size:12px;color:#667085;font-weight:900;margin-bottom:6px}
.image-pair img{width:100%;aspect-ratio:4/3;object-fit:contain;background:linear-gradient(45deg,#f1f5f9 25%,transparent 25%),linear-gradient(-45deg,#f1f5f9 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#f1f5f9 75%),linear-gradient(-45deg,transparent 75%,#f1f5f9 75%);background-size:18px 18px;background-position:0 0,0 9px,9px -9px,-9px 0;border-radius:10px}
.empty{padding:34px;text-align:center;color:#667085;font-weight:900}
a{color:#0b69d1}
@media(max-width:640px){.top{display:block}.login,.ai-login{grid-template-columns:1fr}.wrap{padding:18px 12px 40px}.refine-tools .row,.ai-workbench .row,.ai-workbench .actions{grid-template-columns:1fr}.image-pair,.ai-assets{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <h1>审核台</h1>
      <div class="sub">审核武器和推广证明。通过武器后进入公开库；通过推广后用户获得 10 个上传名额。</div>
    </div>
    <a href="./">返回武器库</a>
  </div>

  <div class="panel">
    <div class="login">
      <input id="reviewKey" type="password" placeholder="输入审核口令">
      <button onclick="loadAll()">进入审核</button>
    </div>
    <div class="ai-login">
      <input id="openaiKey" type="password" placeholder="OpenAI API Key，只保存在本机浏览器">
      <select id="aiQuality">
        <option value="medium">AI 图片质量：medium</option>
        <option value="low">AI 图片质量：low，省钱</option>
        <option value="high">AI 图片质量：high，更精细</option>
      </select>
      <button class="secondary" onclick="saveOpenAIKey()">保存 AI 设置</button>
    </div>
    <div class="status" id="status">请输入审核口令。</div>
  </div>

  <div class="section-title">待审核武器</div>
  <div class="grid" id="weaponGrid"></div>
  <div class="section-title">已通过武器管理</div>
  <div class="grid" id="approvedGrid"></div>
  <div class="section-title">待审核推广证明</div>
  <div class="grid" id="promoGrid"></div>
</div>

<script src="supabase-config.js?v=3"></script>
<script>
const CLOUD=window.MUMU_SUPABASE||{};
const OPENAI_KEY_STORAGE='mumu_admin_openai_key';
const OPENAI_QUALITY_STORAGE='mumu_admin_openai_quality';
function cloudBase(){return String(CLOUD.url||'').replace(/\/+$/,'')}
function headers(){return{apikey:CLOUD.anonKey,Authorization:'Bearer '+CLOUD.anonKey,'Content-Type':'application/json'}}
function escapeHTML(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function status(text){document.getElementById('status').textContent=text}
function key(){return document.getElementById('reviewKey').value.trim()}
function openAIKey(){return document.getElementById('openaiKey').value.trim()||localStorage.getItem(OPENAI_KEY_STORAGE)||''}
function openAIQuality(){return document.getElementById('aiQuality').value||localStorage.getItem(OPENAI_QUALITY_STORAGE)||'medium'}
function saveOpenAIKey(){
  const k=document.getElementById('openaiKey').value.trim();
  const q=document.getElementById('aiQuality').value||'medium';
  if(k)localStorage.setItem(OPENAI_KEY_STORAGE,k);
  localStorage.setItem(OPENAI_QUALITY_STORAGE,q);
  status(k?'AI 设置已保存在本机浏览器。':'已保存图片质量；API Key 为空时不会调用 AI。');
}
function restoreOpenAISettings(){
  const k=localStorage.getItem(OPENAI_KEY_STORAGE)||'';
  const q=localStorage.getItem(OPENAI_QUALITY_STORAGE)||'medium';
  const keyInput=document.getElementById('openaiKey');
  const quality=document.getElementById('aiQuality');
  if(keyInput&&k)keyInput.value=k;
  if(quality)quality.value=q;
}
restoreOpenAISettings();
async function rpc(name,body){
  const res=await fetch(cloudBase()+'/rest/v1/rpc/'+name,{method:'POST',headers:headers(),body:JSON.stringify(body)});
  if(!res.ok){
    let msg='请求失败：'+res.status;
    try{const data=await res.json();msg=data.message||msg}catch(e){}
    throw new Error(msg);
  }
  return res.json();
}
function typeLabel(t){return t==='sword'?'剑刃':t==='gun'?'枪械':'长柄'}
function itemAnalysis(item){
  if(item&&item.analysis&&typeof item.analysis==='object'&&!Array.isArray(item.analysis))return item.analysis;
  return {};
}
function originalImageUrl(item){
  const analysis=itemAnalysis(item);
  return analysis.original_image_url||analysis.admin_original_image_url||item.image_url||'';
}
function refinedImageUrl(item){
  const analysis=itemAnalysis(item);
  return analysis.refined_image_url||analysis.admin_refined_image_url||item.image_url||'';
}
function aiAssetUrl(item,key){
  const analysis=itemAnalysis(item);
  const assets=analysis.ai_assets&&typeof analysis.ai_assets==='object'?analysis.ai_assets:{};
  return assets[key]||analysis[key]||'';
}
function aiWorkbench(item){
  const bg=aiAssetUrl(item,'card_background_url');
  const hand=aiAssetUrl(item,'handheld_showcase_url')||item.showcase_url||'';
  const cut=refinedImageUrl(item);
  return `
    <div class="ai-workbench" data-ai-root>
      <div class="ai-title">AI 精修工作台</div>
      <div class="ai-note">一键执行：识别武器信息、透明抠图、生成专属卡片背景、生成乐高角色手持展示图。结果会先填进表单，你还能手动修改后再通过。</div>
      <div class="ai-assets">
        <figure><figcaption>透明主体</figcaption><img data-ai-cutout src="${escapeHTML(cut)}" alt="AI 透明主体"></figure>
        <figure><figcaption>卡片背景</figcaption><img data-ai-bg src="${escapeHTML(bg)}" alt="AI 卡片背景"></figure>
        <figure><figcaption>手持展示</figcaption><img data-ai-handheld src="${escapeHTML(hand)}" alt="AI 手持展示"></figure>
      </div>
      <div class="row">
        <select data-ai-style>
          <option value="cute-premium">可爱高级积木</option>
          <option value="ssr-legend">SSR 传说闪卡</option>
          <option value="toy-studio">玩具摄影棚</option>
        </select>
        <select data-ai-character>
          <option value="auto">自动匹配 MBTI 角色</option>
          <option value="INTJ">INTJ 战略家</option>
          <option value="ISTJ">ISTJ 检查员</option>
          <option value="ENTP">ENTP 辩论家</option>
          <option value="ENFP">ENFP 竞选者</option>
        </select>
      </div>
      <div class="actions">
        <button class="secondary" onclick="aiAnalyzeOnly('${escapeHTML(item.id)}',this)">只生成描述属性</button>
        <button class="good" onclick="aiRefineFull('${escapeHTML(item.id)}',this)">一键 AI 全流程</button>
      </div>
    </div>`;
}
function refineTools(item){
  const original=originalImageUrl(item);
  const refined=refinedImageUrl(item);
  return `
    <div class="refine-tools" data-original-image="${escapeHTML(original)}">
      <div class="refine-note">主体图精修会保留原图记录，再把当前公开武器图替换成透明背景版本。若自动效果不够好，可以上传你自己处理好的 PNG/WebP。</div>
      <div class="image-pair">
        <figure><figcaption>原始上传图</figcaption><img src="${escapeHTML(original)}" alt="原始上传图"></figure>
        <figure><figcaption>当前公开图</figcaption><img data-current-image src="${escapeHTML(refined)}" alt="当前公开图"></figure>
      </div>
      <div class="row">
        <input type="file" accept="image/png,image/jpeg,image/webp" data-main-image-file>
        <button class="secondary" onclick="uploadMainImage('${escapeHTML(item.id)}',this)">上传替换主体图</button>
        <button class="secondary" onclick="autoRefineMainImage('${escapeHTML(item.id)}',this)">自动精修抠图</button>
      </div>
      <div class="line"><a href="${escapeHTML(original)}" target="_blank" rel="noopener">看原始图</a> · <a href="${escapeHTML(refined)}" target="_blank" rel="noopener">看当前图</a></div>
    </div>`;
}
async function loadAll(){
  await loadPending();
  await loadApproved();
  await loadPromotions();
}
async function loadPending(){
  if(!key()){status('先输入审核口令。');return}
  status('正在读取待审核武器...');
  try{
    const rows=await rpc('list_pending_weapons_v2',{input_review_key:key()});
    renderWeapons(rows);
    status('武器待审核 '+rows.length+' 件。');
  }catch(err){status(err.message||'读取失败');}
}
async function loadPromotions(){
  if(!key())return;
  try{
    const rows=await rpc('list_pending_promotions',{input_review_key:key()});
    renderPromotions(rows);
    status((document.querySelectorAll('#weaponGrid .card').length||0)+' 件武器待审，'+(document.querySelectorAll('#approvedGrid .card').length||0)+' 件已通过，'+rows.length+' 条推广证明待审核。');
  }catch(err){status(err.message||'读取推广证明失败');}
}
function weaponEditor(item,extra=''){
  return `
    <div class="edit-grid">
      <label>武器名<input data-field="name" maxlength="20" value="${escapeHTML(item.name)}"></label>
      <label>创建者<input data-field="creator" maxlength="16" value="${escapeHTML(item.creator)}"></label>
      <label>类型<select data-field="type">
        <option value="sword" ${item.type==='sword'?'selected':''}>剑刃</option>
        <option value="gun" ${item.type==='gun'?'selected':''}>枪械</option>
        <option value="spear" ${item.type==='spear'?'selected':''}>长柄</option>
      </select></label>
      <label>分类名<input data-field="label" maxlength="20" value="${escapeHTML(item.label||typeLabel(item.type))}"></label>
      <label>技能<input data-field="skill" maxlength="28" value="${escapeHTML(item.skill||'')}"></label>
      <label>积木数<input data-field="piece_count" type="number" min="0" max="300" value="${escapeHTML(item.piece_count||0)}"></label>
      <label>AI战力<input data-field="ai_power" type="number" min="1" max="500" value="${escapeHTML(item.ai_power||100)}"></label>
      <label>收藏等级<select data-field="card_rarity">
        <option value="" ${!item.card_rarity?'selected':''}>自动计算</option>
        <option value="SSR" ${item.card_rarity==='SSR'?'selected':''}>SSR 传说</option>
        <option value="SR" ${item.card_rarity==='SR'?'selected':''}>SR 稀有</option>
        <option value="R" ${item.card_rarity==='R'?'selected':''}>R 精良</option>
        <option value="N" ${item.card_rarity==='N'?'selected':''}>N 普通</option>
      </select></label>
      <label>卡片评分<input data-field="card_score" type="number" min="0" max="999" value="${escapeHTML(item.card_score||0)}" placeholder="0 为自动"></label>
      <label>防御<input data-field="defense" type="number" min="1" max="300" value="${escapeHTML(item.defense||82)}"></label>
      <label>暴击<input data-field="crit" type="number" min="0" max="1" step="0.01" value="${escapeHTML(item.crit||0.12)}"></label>
      <label>展示图地址<input data-field="showcase_url" value="${escapeHTML(item.showcase_url||'')}" placeholder="上传后自动填入"></label>
      <label>显示站点<select data-field="locale">
        <option value="both" ${(item.locale||'both')==='both'?'selected':''}>中英文都显示</option>
        <option value="zh-CN" ${item.locale==='zh-CN'?'selected':''}>只显示中文站</option>
        <option value="en" ${item.locale==='en'?'selected':''}>只显示英文站</option>
      </select></label>
      <label>英文名<input data-field="name_en" maxlength="40" value="${escapeHTML(item.name_en||'')}" placeholder="English weapon name"></label>
      <label>英文分类<input data-field="label_en" maxlength="28" value="${escapeHTML(item.label_en||'')}" placeholder="Blade / Blaster..."></label>
      <label>英文技能<input data-field="skill_en" maxlength="40" value="${escapeHTML(item.skill_en||'')}" placeholder="English skill name"></label>
    </div>
    <textarea data-field="description" maxlength="120" placeholder="武器介绍">${escapeHTML(item.description||'')}</textarea>
    <textarea data-field="description_en" maxlength="180" placeholder="English description">${escapeHTML(item.description_en||'')}</textarea>
    ${extra}`;
}
function collectWeaponFields(card){
  const fields={};
  card.querySelectorAll('[data-field]').forEach(input=>fields[input.dataset.field]=input.value.trim());
  return fields;
}
function renderWeapons(rows){
  const grid=document.getElementById('weaponGrid');
  if(!rows.length){grid.innerHTML='<div class="panel empty">暂时没有待审核内容。</div>';return}
  grid.innerHTML=rows.map(item=>`
    <div class="panel card" data-id="${escapeHTML(item.id)}">
      <div class="image"><img src="${escapeHTML(item.image_url)}" alt="${escapeHTML(item.name)}"></div>
      <div class="meta">
        <div class="name">${escapeHTML(item.name)}</div>
        <div class="chips">
          <span class="chip">${escapeHTML(typeLabel(item.type))}</span>
          <span class="chip">创建者：${escapeHTML(item.creator)}</span>
        </div>
        <div class="line">${escapeHTML(item.description)}</div>
        <div class="line">技能：${escapeHTML(item.skill)}</div>
        <div class="line">AI估算：${escapeHTML(item.piece_count||0)} 颗积木 · 战力 ${escapeHTML(item.ai_power||100)}</div>
        <div class="line">推广证明：${escapeHTML(item.share_proof||'无')}</div>
        <div class="line"><a href="${escapeHTML(item.image_url)}" target="_blank" rel="noopener">新窗口看原图</a></div>
        ${refineTools(item)}
        ${aiWorkbench(item)}
        ${weaponEditor(item)}
        <div class="showcase-tools">
          <input type="file" accept="image/*" data-showcase-file>
          <button class="secondary" onclick="uploadShowcase('${escapeHTML(item.id)}',this)">上传展示图</button>
        </div>
        <textarea placeholder="审核备注，可不填"></textarea>
        <div class="actions three">
          <button class="secondary" onclick="saveWeapon('${escapeHTML(item.id)}',this)">仅保存修改</button>
          <button class="good" onclick="reviewWeapon('${escapeHTML(item.id)}','approved',this)">通过</button>
          <button class="bad" onclick="reviewWeapon('${escapeHTML(item.id)}','rejected',this)">拒绝</button>
        </div>
      </div>
    </div>`).join('');
}
async function reviewWeapon(id,decision,btn){
  const card=btn.closest('.card');
  const note=card.querySelector('textarea:not([data-field])').value.trim();
  await saveWeapon(id,btn,true);
  const fields=collectWeaponFields(card);
  btn.disabled=true;
  status(decision==='approved'?'正在通过...':'正在拒绝...');
  try{
    await rpc('review_weapon_with_edits',{
      input_review_key:key(),
      weapon_id:id,
      decision,
      note,
      edited_name:fields.name,
      edited_creator:fields.creator,
      edited_piece_count:Number(fields.piece_count||0),
      edited_ai_power:Number(fields.ai_power||100),
      edited_card_rarity:fields.card_rarity,
      edited_card_score:Number(fields.card_score||0),
      edited_defense:Number(fields.defense||82),
      edited_crit:Number(fields.crit||0.12)
    });
    card.remove();
    status(decision==='approved'?'已通过。':'已拒绝。');
    if(!document.querySelector('#weaponGrid .card'))loadPending();
  }catch(err){
    btn.disabled=false;
    status(err.message||'操作失败');
  }
}
async function loadApproved(){
  if(!key())return;
  status('正在读取已通过武器...');
  try{
    const rows=await rpc('list_admin_weapons',{input_review_key:key()});
    renderApproved(rows);
  }catch(err){status(err.message||'读取已通过武器失败');}
}
function renderApproved(rows){
  const grid=document.getElementById('approvedGrid');
  if(!rows.length){grid.innerHTML='<div class="panel empty">暂时没有已通过武器。</div>';return}
  grid.innerHTML=rows.map(item=>`
    <div class="panel card" data-id="${escapeHTML(item.id)}">
      <div class="image"><img src="${escapeHTML(item.showcase_url||item.image_url)}" alt="${escapeHTML(item.name)}"></div>
      <div class="meta">
        <div class="name">${escapeHTML(item.name)}</div>
        <div class="chips">
          <span class="chip">${escapeHTML(typeLabel(item.type))}</span>
          <span class="chip">创建者：${escapeHTML(item.creator)}</span>
        </div>
        <div class="line"><a href="${escapeHTML(item.image_url)}" target="_blank" rel="noopener">原武器图</a>${item.showcase_url?' · <a href="'+escapeHTML(item.showcase_url)+'" target="_blank" rel="noopener">展示图</a>':' · 未配展示图'}</div>
        ${refineTools(item)}
        ${aiWorkbench(item)}
        ${weaponEditor(item)}
        <div class="showcase-tools">
          <input type="file" accept="image/*" data-showcase-file>
          <button class="secondary" onclick="uploadShowcase('${escapeHTML(item.id)}',this)">上传/更换展示图</button>
        </div>
        <div class="actions">
          <button class="good" onclick="saveWeapon('${escapeHTML(item.id)}',this)">保存信息</button>
          <button class="secondary" onclick="loadApproved()">刷新</button>
        </div>
      </div>
    </div>`).join('');
}
async function uploadShowcase(id,btn){
  const card=btn.closest('.card');
  const file=card.querySelector('[data-showcase-file]').files[0];
  if(!file){status('先选择一张展示图。');return}
  btn.disabled=true;
  status('正在上传展示图...');
  try{
    const ext=(file.type&&file.type.includes('png'))?'png':'webp';
    const path='showcase-'+id+'-'+Date.now()+'.'+ext;

async function imageUrlToCanvas(url,maxEdge=1300){

  if(!res.ok)throw new Error('图片读取失败：'+res.status);

function medianValue(values){
  if(!values.length)return 0;
  values=values.slice().sort((a,b)=>a-b);
  return values[Math.floor(values.length/2)];
}
function colorStatsFromSamples(samples){
  const bg=[
    medianValue(samples.map(c=>c[0])),
    medianValue(samples.map(c=>c[1])),
    medianValue(samples.map(c=>c[2]))
  ];
  return {bg,spread:medianValue(samples.map(c=>Math.hypot(c[0]-bg[0],c[1]-bg[1],c[2]-bg[2])))};
}
function localEdgeStrength(data,w,h,x,y){
  const left=(y*w+Math.max(0,x-1))*4;
  const right=(y*w+Math.min(w-1,x+1))*4;
  const up=(Math.max(0,y-1)*w+x)*4;
  const down=(Math.min(h-1,y+1)*w+x)*4;
  return (
    Math.abs(data[left]-data[right])+Math.abs(data[left+1]-data[right+1])+Math.abs(data[left+2]-data[right+2])+
    Math.abs(data[up]-data[down])+Math.abs(data[up+1]-data[down+1])+Math.abs(data[up+2]-data[down+2])
  )/2;
}
function brickProtectedRGB(r,g,b,bg,threshold,bright,sat,dist){
  const max=Math.max(r,g,b),min=Math.min(r,g,b);
  const red=r>130&&r>g+14&&r>b+14;
  const yellow=r>128&&g>94&&b<150&&r>b+24&&g>b+18;
  const blue=b>r+12&&b>g+2;
  const cyan=g>r+8&&b>r+8&&bright<232;
  const pink=r>138&&b>96&&g<180&&r>g+10;
  const green=g>r+10&&g>b+6&&bright<225;
  const brown=r>92&&g>48&&b<82&&r>b+34&&sat>54&&bright<150;
  const whiteBrick=bright>180&&sat<24&&dist>threshold*.7;
  const darkBrick=bright<92&&dist>threshold*.22;
  return (max-min>18&&(red||yellow||blue||cyan||pink||green||brown))||whiteBrick||darkBrick;
}
function adminCutoutCanvas(canvas){
  const ctx=canvas.getContext('2d',{willReadFrequently:true});
  const w=canvas.width,h=canvas.height;
  const img=ctx.getImageData(0,0,w,h);
  const data=img.data;
  const samples=[];
  const step=Math.max(1,Math.floor(Math.min(w,h)/36));
  const pushAt=(x,y)=>{const p=(y*w+x)*4;samples.push([data[p],data[p+1],data[p+2]])};
  for(let x=0;x<w;x+=step){pushAt(x,0);pushAt(x,h-1)}
  for(let y=0;y<h;y+=step){pushAt(0,y);pushAt(w-1,y)}
  const stats=colorStatsFromSamples(samples);
  const bg=stats.bg;
  const luminance=bg[0]*.299+bg[1]*.587+bg[2]*.114;
  const bgSat=Math.max(bg[0],bg[1],bg[2])-Math.min(bg[0],bg[1],bg[2]);
  const threshold=Math.max(28,Math.min(112,stats.spread*2.15+(luminance>170?34:24)))*.72;
  const visited=new Uint8Array(w*h);
  const queue=[];
  function scoreAt(x,y){
    const p=(y*w+x)*4;
    const r=data[p],g=data[p+1],b=data[p+2];
    const dist=Math.hypot(r-bg[0],g-bg[1],b-bg[2]);
    const bright=r*.299+g*.587+b*.114;
    const sat=Math.max(r,g,b)-Math.min(r,g,b);
    const edge=localEdgeStrength(data,w,h,x,y);
    const protectedBrick=brickProtectedRGB(r,g,b,bg,threshold,bright,sat,dist)||(edge>54&&(sat>28||dist>threshold*.75));
    const chromaDist=Math.hypot((r-bright)-(bg[0]-luminance),(g-bright)-(bg[1]-luminance),(b-bright)-(bg[2]-luminance));
    const warmFloor=r>b+10&&g>b+4&&sat<44&&bright>88;
    const paleBackground=bright>176&&sat<34;
    const softShadow=bright>42&&bright<luminance-8&&sat<38&&chromaDist<threshold*.62;
    const grayFloor=bgSat<46&&sat<38&&bright>72&&chromaDist<threshold*.68;
    const sameSurface=sat<46&&chromaDist<threshold*.62&&edge<86;
    const smoothBackground=edge<72&&sat<50;
    return {bgLike:!protectedBrick&&smoothBackground&&(dist<threshold||sameSurface||(luminance>165&&paleBackground&&chromaDist<threshold*.72)||(bgSat<58&&warmFloor&&chromaDist<threshold*.74)||grayFloor||softShadow),protectedBrick,sameSurface,sat,bright,chromaDist,edge,dist};
  }
  function push(x,y){
    if(x<0||x>=w||y<0||y>=h)return;
    const idx=y*w+x;
    if(visited[idx])return;
    if(scoreAt(x,y).bgLike){visited[idx]=1;queue.push(idx)}
  }
  for(let x=0;x<w;x++){push(x,0);push(x,h-1)}
  for(let y=0;y<h;y++){push(0,y);push(w-1,y)}
  for(let qi=0;qi<queue.length;qi++){
    const idx=queue[qi],x=idx%w,y=(idx-x)/w;
    push(x+1,y);push(x-1,y);push(x,y+1);push(x,y-1);
  }
  const keep=new Uint8Array(w*h);
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const idx=y*w+x,p=idx*4,score=scoreAt(x,y);
    if(visited[idx]||(!score.protectedBrick&&(score.sameSurface||(score.sat<54&&score.bright>58)||(score.sat<64&&score.bright>78&&score.chromaDist<threshold*1.18)))){
      data[p+3]=0;
    }
    if(data[p+3]>8)keep[idx]=1;
  }
  ctx.putImageData(img,0,0);
  return trimTransparentCanvas(canvas);
}
function trimTransparentCanvas(source){
  const ctx=source.getContext('2d',{willReadFrequently:true});
  const w=source.width,h=source.height;
  const data=ctx.getImageData(0,0,w,h).data;
  let minX=w,minY=h,maxX=-1,maxY=-1;
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    if(data[(y*w+x)*4+3]>18){
      if(x<minX)minX=x;if(y<minY)minY=y;if(x>maxX)maxX=x;if(y>maxY)maxY=y;
    }
  }
  if(maxX<0)return source;
  const pad=Math.round(Math.min(w,h)*.04);
  minX=Math.max(0,minX-pad);minY=Math.max(0,minY-pad);maxX=Math.min(w-1,maxX+pad);maxY=Math.min(h-1,maxY+pad);
  const out=document.createElement('canvas');
  out.width=maxX-minX+1;out.height=maxY-minY+1;
  out.getContext('2d').drawImage(source,minX,minY,out.width,out.height,0,0,out.width,out.height);
  return out;
}

function b64ToBlob(b64,mime='image/png'){
  const bin=atob(b64);

  return new Blob([bytes],{type:mime});
}
function extractOpenAIText(data){
  if(data.output_text)return data.output_text;
  const out=[];
  (data.output||[]).forEach(item=>{
    (item.content||[]).forEach(part=>{
      if(part.text)out.push(part.text);
      if(part.type==='output_text'&&part.text)out.push(part.text);
    });
  });
  return out.join('\n').trim();
}

    const showcaseInput=card.querySelector('[data-field="showcase_url"]');
    if(showcaseInput)showcaseInput.value=handUrl;
    if(root&&root.querySelector('[data-ai-handheld]'))root.querySelector('[data-ai-handheld]').src=handUrl;
    await saveWeapon(id,btn,true);
    try{
      await rpc('admin_update_weapon_ai_assets',{
        input_review_key:key(),
        weapon_id:id,
        refined_image_url:cutoutUrl,
        card_background_url:bgUrl,
        handheld_showcase_url:handUrl,
        ai_metadata:Object.assign({},ai,{admin_ai_style:style,admin_ai_character:character,filled_fields:fields})
      });
      status('AI 全流程完成：主体、背景、手持展示图、属性都已保存。审核通过后公开站会显示新版展示图。');
    }catch(metaErr){
      status('AI 图片和表单已保存；但 AI 元数据保存失败。请运行新版 supabase-schema.sql 后再试一次保存元数据。');
    }
  }catch(err){
    status((err&&err.message)||'AI 全流程失败。若提示函数不存在，请先运行新版 supabase-schema.sql。');
  }finally{
    btn.disabled=false;
  }
}
async function replaceMainImage(id,nextUrl,originalUrl,btn){
  await rpc('admin_replace_weapon_image',{
    input_review_key:key(),
    weapon_id:id,
    new_image_url:nextUrl,
    original_image_url:originalUrl||''
  });
  const card=btn.closest('.card');
  const current=card.querySelector('[data-current-image]');
  const hero=card.querySelector('.image img');
  if(current)current.src=nextUrl;
  if(hero)hero.src=nextUrl;
}
async function autoRefineMainImage(id,btn){
  const card=btn.closest('.card');
  const originalSource=card.querySelector('.refine-tools');
  const img=card.querySelector('[data-current-image]');
  const source=(originalSource&&originalSource.dataset.originalImage)||(img&&img.src);
  if(!source){status('没有找到可处理的图片。');return}
  btn.disabled=true;
  status('正在自动精修主体图...');
  try{
    const canvas=await imageUrlToCanvas(source);
    const refined=adminCutoutCanvas(canvas);
    const blob=await canvasToBlob(refined,'image/webp',.92);
    const url=await uploadImageBlob(blob,id,'refined-weapon');
    await replaceMainImage(id,url,source,btn);
    status('主体图已自动精修并保存。公开站刷新后会显示新版。');
  }catch(err){
    status((err&&err.message)||'自动精修失败。若提示函数不存在，请先运行新版 supabase-schema.sql 里的 admin_replace_weapon_image SQL。');
  }finally{
    btn.disabled=false;
  }
}
async function uploadMainImage(id,btn){
  const card=btn.closest('.card');
  const file=card.querySelector('[data-main-image-file]').files[0];
  if(!file){status('先选择一张透明 PNG/WebP 或要处理的照片。');return}
  const img=card.querySelector('[data-current-image]');
  const originalSource=card.querySelector('.refine-tools');
  const original=(originalSource&&originalSource.dataset.originalImage)||(img&&img.src)||'';
  btn.disabled=true;
  status('正在上传替换主体图...');
  try{
    const blob=await fileToWebpBlob(file);
    const url=await uploadImageBlob(blob,id,'main-weapon');
    await replaceMainImage(id,url,original,btn);
    status('主体图已替换并保存。公开站刷新后会显示新版。');
  }catch(err){
    status((err&&err.message)||'主体图替换失败。若提示函数不存在，请先运行新版 supabase-schema.sql 里的 admin_replace_weapon_image SQL。');
  }finally{
    btn.disabled=false;
  }
}
function renderPromotions(rows){
  const grid=document.getElementById('promoGrid');
  if(!rows.length){grid.innerHTML='<div class="panel empty">暂时没有待审核推广证明。</div>';return}
  grid.innerHTML=rows.map(item=>`
    <div class="panel card" data-id="${escapeHTML(item.id)}">
      <div class="meta">
        <div class="name">${escapeHTML(item.creator)}</div>
        <div class="chips"><span class="chip">奖励 +${escapeHTML(item.bonus_slots)} 名额</span></div>
        <div class="line">证明：${escapeHTML(item.proof)}</div>
        <textarea placeholder="审核备注，可不填"></textarea>
        <div class="actions">
          <button class="good" onclick="reviewPromotion('${escapeHTML(item.id)}','approved',this)">通过</button>
          <button class="bad" onclick="reviewPromotion('${escapeHTML(item.id)}','rejected',this)">拒绝</button>
        </div>
      </div>
    </div>`).join('');
}
async function reviewPromotion(id,decision,btn){
  const card=btn.closest('.card');
  const note=card.querySelector('textarea').value.trim();
  btn.disabled=true;
  status(decision==='approved'?'正在通过推广证明...':'正在拒绝推广证明...');
  try{
    await rpc('review_promotion',{input_review_key:key(),promotion_id:id,decision,note});
    card.remove();
    status(decision==='approved'?'推广证明已通过，用户刷新后获得 +10 名额。':'推广证明已拒绝。');
    if(!document.querySelector('#promoGrid .card'))loadPromotions();
  }catch(err){
    btn.disabled=false;
    status(err.message||'操作失败');
  }
}
</script>

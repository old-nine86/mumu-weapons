<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>沐沐积木武器库 · 审核台</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at 10% 0,#ffe7ef 0 16rem,transparent 34rem),radial-gradient(circle at 86% 8%,#d9f0ff 0 18rem,transparent 36rem),linear-gradient(180deg,#fffaf2,#eef7ff 52%,#fff8fb);color:#1f2933}
.wrap{max-width:1280px;margin:0 auto;padding:30px 18px 64px}
.top{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:22px;padding:18px 4px}
h1{margin:0;font-size:clamp(28px,4vw,48px);letter-spacing:0}
.sub{margin-top:8px;color:#667085;font-weight:700}
.panel{background:rgba(255,255,255,.86);border:1px solid rgba(31,41,51,.1);box-shadow:0 22px 55px rgba(31,41,51,.1);border-radius:24px;padding:18px;backdrop-filter:blur(18px)}
.login{display:grid;grid-template-columns:1fr auto;gap:10px;margin-bottom:18px}
.ai-login{display:grid;grid-template-columns:1.05fr 1.1fr .85fr auto;gap:10px;margin-top:10px}
.bulk-tools{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:12px 0 4px}
input,textarea,select{width:100%;border:1px solid rgba(31,41,51,.14);border-radius:14px;padding:13px 14px;font:inherit;background:white;outline:none}
textarea{min-height:78px;resize:vertical}
.edit-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.edit-grid label{display:flex;flex-direction:column;gap:5px;color:#667085;font-size:12px;font-weight:900}
.edit-grid input,.edit-grid select{padding:10px 11px;border-radius:12px;font-size:14px;font-weight:850}
button{border:0;border-radius:14px;padding:13px 16px;font:inherit;font-weight:900;cursor:pointer;background:#1f2933;color:white;box-shadow:0 12px 24px rgba(31,41,51,.12)}
button.secondary{background:#edf2f7;color:#1f2933}
button.good{background:#17a36b}
button.bad{background:#e5484d}
button:disabled{opacity:.45;cursor:not-allowed}
.status{color:#667085;font-weight:800;margin:12px 0 0}
.section-title{font-size:24px;font-weight:950;margin:28px 0 12px;display:flex;align-items:center;gap:10px}
.section-title::before{content:"";width:12px;height:28px;border-radius:999px;background:linear-gradient(180deg,#ff8a72,#ffd96a,#8ee6c6,#9fd7ff)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:20px}
.card{overflow:hidden}
.image{background:linear-gradient(135deg,#fff,#f7fbff);border-radius:20px;aspect-ratio:4/3;display:grid;place-items:center;border:1px solid rgba(31,41,51,.08);overflow:hidden}
.image img{max-width:100%;max-height:100%;object-fit:contain}
.meta{padding:14px 2px 0}
.name{font-size:22px;font-weight:950;margin-bottom:6px}
.line{color:#667085;font-weight:750;margin:4px 0;word-break:break-word}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.chip{background:#edf2f7;border-radius:999px;padding:6px 10px;font-weight:900;font-size:13px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.actions.three{grid-template-columns:1fr 1fr 1fr}
.showcase-tools{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:10px;align-items:center}
.showcase-tools input{padding:10px;border-radius:12px}
.refine-tools{display:grid;grid-template-columns:1fr;gap:10px;margin-top:12px;padding:12px;border:1px solid rgba(255,166,77,.22);border-radius:18px;background:linear-gradient(135deg,#fffaf0,#fff)}
.refine-tools .row{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center}
.refine-tools input{padding:10px;border-radius:12px}
.refine-note{color:#8a5b1d;font-size:12px;font-weight:850;line-height:1.55}
.ai-workbench{display:grid;gap:12px;margin-top:12px;padding:14px;border:1px solid rgba(95,73,255,.18);border-radius:20px;background:linear-gradient(135deg,#f6f3ff,#fff8ee);box-shadow:inset 0 1px 0 rgba(255,255,255,.7)}
.ai-workbench .row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ai-workbench .actions{grid-template-columns:1fr 1fr}
.ai-title{font-weight:950;color:#39257d}
.ai-note{color:#655a7c;font-size:12px;font-weight:850;line-height:1.55}
.ai-card-status{padding:9px 10px;border-radius:12px;background:rgba(57,37,125,.08);color:#39257d;font-size:12px;font-weight:900;line-height:1.45}
.ai-assets{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ai-assets figure{margin:0;padding:7px;border:1px solid rgba(95,73,255,.12);border-radius:13px;background:white}
.ai-assets figcaption{font-size:11px;color:#655a7c;font-weight:900;margin-bottom:5px}
.ai-assets img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:12px;background:#f4f0ff}
.admin-hero{display:grid;grid-template-columns:1.2fr .8fr;gap:14px;align-items:stretch}
.admin-hero .panel{min-height:100%}
.admin-steps{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.admin-step{background:rgba(255,255,255,.75);border:1px solid rgba(31,41,51,.08);border-radius:16px;padding:12px;font-weight:900;color:#4d5663}
.admin-step b{display:block;color:#1f2933;font-size:18px;margin-bottom:3px}
.image-pair{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.image-pair figure{margin:0;padding:8px;border:1px solid rgba(31,41,51,.08);border-radius:14px;background:#fff}
.image-pair figcaption{font-size:12px;color:#667085;font-weight:900;margin-bottom:6px}
.image-pair img{width:100%;aspect-ratio:4/3;object-fit:contain;background:linear-gradient(45deg,#f1f5f9 25%,transparent 25%),linear-gradient(-45deg,#f1f5f9 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#f1f5f9 75%),linear-gradient(-45deg,transparent 75%,#f1f5f9 75%);background-size:18px 18px;background-position:0 0,0 9px,9px -9px,-9px 0;border-radius:10px}
.empty{padding:34px;text-align:center;color:#667085;font-weight:900}
a{color:#0b69d1}
@media(max-width:780px){.top,.admin-hero{display:block}.login,.ai-login,.bulk-tools{grid-template-columns:1fr}.wrap{padding:18px 12px 40px}.refine-tools .row,.ai-workbench .row,.ai-workbench .actions,.admin-steps{grid-template-columns:1fr}.image-pair,.ai-assets{grid-template-columns:1fr}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <h1>审核台</h1>
      <div class="sub">审核武器和推广证明。通过武器后进入公开库；通过推广后用户获得 10 个上传名额。</div>
    </div>
    <a href="./">返回武器库</a>
  </div>

  <div class="admin-hero">
    <div class="panel">
      <div class="login">
        <input id="reviewKey" type="password" placeholder="输入审核口令">
        <button onclick="loadAll()">进入审核</button>
      </div>
      <div class="ai-login">
        <select id="aiProvider">
          <option value="local">本地自动：无 API 也能跑</option>
          <option value="openrouter">OpenRouter 免费模型：自动换模型</option>
          <option value="gemini">Google Gemini：识别+图片生成</option>
          <option value="openai">OpenAI：全流程</option>
        </select>
        <input id="aiKey" type="password" placeholder="AI API Key，可不填">
        <select id="aiQuality">
          <option value="medium">图片质量：medium</option>
          <option value="low">图片质量：low，省钱</option>
          <option value="high">图片质量：high，更精细</option>
        </select>
        <button class="secondary" onclick="saveOpenAIKey()">保存设置</button>
      </div>
      <div class="bulk-tools">
        <button class="good" onclick="bulkCompleteWeapons('all',this)">一键补全全部已加载</button>
        <button class="secondary" onclick="bulkCompleteWeapons('pending',this)">只补待审核</button>
        <button class="secondary" onclick="bulkCompleteWeapons('approved',this)">只补已通过</button>
        <button class="secondary" onclick="loadAll()">刷新后台数据</button>
      </div>
      <div class="line">批量补全会自动补中文/英文资料、等级数值、透明主体、卡片背景和手持展示图；默认使用本地自动流程，不消耗 API。</div>
      <div class="status" id="status">请输入审核口令。无 API 时选择“本地自动”，也能生成文字、属性、背景和展示图。</div>
    </div>
    <div class="panel">
      <div class="name">自动精修流程</div>
      <div class="admin-steps">
        <div class="admin-step"><b>1</b>识别属性</div>
        <div class="admin-step"><b>2</b>清理主体</div>
        <div class="admin-step"><b>3</b>生成橱窗</div>
      </div>
      <div class="line">推荐：先用“本地自动”稳定出图，再手动微调名称和数值。</div>
    </div>
  </div>

  <div class="section-title">待审核武器</div>
  <div class="grid" id="weaponGrid"></div>
  <div class="section-title">已通过武器管理</div>
  <div class="grid" id="approvedGrid"></div>
  <div class="section-title">待审核推广证明</div>
  <div class="grid" id="promoGrid"></div>
</div>

<script src="supabase-config.js?v=3"></script>
<script>
const CLOUD=window.MUMU_SUPABASE||{};
const AI_KEY_STORAGE='mumu_admin_ai_key';
const AI_PROVIDER_STORAGE='mumu_admin_ai_provider';
const OPENROUTER_MODELS_STORAGE='mumu_admin_openrouter_free_vision_models';
const OPENAI_KEY_STORAGE='mumu_admin_openai_key';
const OPENAI_QUALITY_STORAGE='mumu_admin_openai_quality';
const OPENROUTER_BAD_MODELS_STORAGE='mumu_admin_openrouter_bad_models';
function cloudBase(){return String(CLOUD.url||'').replace(/\/+$/,'')}
function headers(){return{apikey:CLOUD.anonKey,Authorization:'Bearer '+CLOUD.anonKey,'Content-Type':'application/json'}}
function escapeHTML(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function status(text){document.getElementById('status').textContent=text}
function key(){return document.getElementById('reviewKey').value.trim()}
function aiProvider(){return document.getElementById('aiProvider').value||localStorage.getItem(AI_PROVIDER_STORAGE)||'local'}
function aiKey(){return document.getElementById('aiKey').value.trim()||localStorage.getItem(AI_KEY_STORAGE)||localStorage.getItem(OPENAI_KEY_STORAGE)||''}
function openAIKey(){return aiKey()}
function openAIQuality(){return document.getElementById('aiQuality').value||localStorage.getItem(OPENAI_QUALITY_STORAGE)||'medium'}
function saveOpenAIKey(){
  const k=document.getElementById('aiKey').value.trim();
  const provider=aiProvider();
  const q=document.getElementById('aiQuality').value||'medium';
  if(k)localStorage.setItem(AI_KEY_STORAGE,k);
  localStorage.setItem(AI_PROVIDER_STORAGE,provider);
  if(provider==='openrouter'){
    localStorage.removeItem(OPENROUTER_MODELS_STORAGE);
    localStorage.removeItem(OPENROUTER_BAD_MODELS_STORAGE);
  }
  localStorage.setItem(OPENAI_QUALITY_STORAGE,q);
  status(k?'AI 设置已保存在本机浏览器。当前服务：'+provider:'已保存图片质量；API Key 为空时不会调用 AI。');
}
function restoreOpenAISettings(){
  const k=localStorage.getItem(AI_KEY_STORAGE)||localStorage.getItem(OPENAI_KEY_STORAGE)||'';
  const provider=localStorage.getItem(AI_PROVIDER_STORAGE)||'local';
  const q=localStorage.getItem(OPENAI_QUALITY_STORAGE)||'medium';
  const keyInput=document.getElementById('aiKey');
  const providerInput=document.getElementById('aiProvider');
  const quality=document.getElementById('aiQuality');
  if(keyInput&&k)keyInput.value=k;
  if(providerInput)providerInput.value=provider;
  if(quality)quality.value=q;
}
restoreOpenAISettings();
async function rpc(name,body){
  const res=await fetch(cloudBase()+'/rest/v1/rpc/'+name,{method:'POST',headers:headers(),body:JSON.stringify(body)});
  if(!res.ok){
    let msg='请求失败：'+res.status;
    try{const data=await res.json();msg=data.message||msg}catch(e){}
    throw new Error(msg);
  }
  return res.json();
}
function typeLabel(t){return t==='sword'?'剑刃':t==='gun'?'枪械':'长柄'}
function itemAnalysis(item){
  if(item&&item.analysis&&typeof item.analysis==='object'&&!Array.isArray(item.analysis))return item.analysis;
  return {};
}
function originalImageUrl(item){
  const analysis=itemAnalysis(item);
  return analysis.original_image_url||analysis.admin_original_image_url||item.image_url||'';
}
function refinedImageUrl(item){
  const analysis=itemAnalysis(item);
  return analysis.refined_image_url||analysis.admin_refined_image_url||item.image_url||'';
}
function aiAssetUrl(item,key){
  const analysis=itemAnalysis(item);
  const assets=analysis.ai_assets&&typeof analysis.ai_assets==='object'?analysis.ai_assets:{};
  return assets[key]||analysis[key]||'';
}
function aiWorkbench(item){
  const bg=aiAssetUrl(item,'card_background_url');
  const hand=aiAssetUrl(item,'handheld_showcase_url')||item.showcase_url||'';
  const cut=refinedImageUrl(item);
  return `
    <div class="ai-workbench" data-ai-root>
      <div class="ai-title">AI 精修工作台</div>
      <div class="ai-note">一键执行：生成武器信息、清理主体、生成专属卡片背景、生成积木角色展示图。无 API 时会自动使用本地稳定流程。</div>
      <div class="ai-assets">
        <figure><figcaption>透明主体</figcaption><img data-ai-cutout src="${escapeHTML(cut)}" alt="AI 透明主体"></figure>
        <figure><figcaption>卡片背景</figcaption><img data-ai-bg src="${escapeHTML(bg)}" alt="AI 卡片背景"></figure>
        <figure><figcaption>手持展示</figcaption><img data-ai-handheld src="${escapeHTML(hand)}" alt="AI 手持展示"></figure>
      </div>
      <div class="row">
        <select data-ai-style>
          <option value="cute-premium">可爱高级积木</option>
          <option value="ssr-legend">SSR 传说闪卡</option>
          <option value="toy-studio">玩具摄影棚</option>
        </select>
        <select data-ai-character>
          <option value="auto">自动匹配 MBTI 角色</option>
          <option value="INTJ">INTJ 战略家</option>
          <option value="ISTJ">ISTJ 检查员</option>
          <option value="ENTP">ENTP 辩论家</option>
          <option value="ENFP">ENFP 竞选者</option>
        </select>
      </div>
      <div class="actions">
        <button class="secondary" onclick="aiAnalyzeOnly('${escapeHTML(item.id)}',this)">只生成描述属性</button>
        <button class="good" data-batch-refine-button onclick="aiRefineFull('${escapeHTML(item.id)}',this)">一键 AI 全流程</button>
      </div>
      <div class="ai-card-status" data-ai-status>等待运行。本地自动模式会直接生成文字、属性、背景和展示图。</div>
    </div>`;
}
function refineTools(item){
  const original=originalImageUrl(item);
  const refined=refinedImageUrl(item);
  return `
    <div class="refine-tools" data-original-image="${escapeHTML(original)}">
      <div class="refine-note">主体图精修会保留原图记录，再把当前公开武器图替换成透明背景版本。若自动效果不够好，可以上传你自己处理好的 PNG/WebP。</div>
      <div class="image-pair">
        <figure><figcaption>原始上传图</figcaption><img src="${escapeHTML(original)}" alt="原始上传图"></figure>
        <figure><figcaption>当前公开图</figcaption><img data-current-image src="${escapeHTML(refined)}" alt="当前公开图"></figure>
      </div>
      <div class="row">
        <input type="file" accept="image/png,image/jpeg,image/webp" data-main-image-file>
        <button class="secondary" onclick="uploadMainImage('${escapeHTML(item.id)}',this)">上传替换主体图</button>
        <button class="secondary" onclick="autoRefineMainImage('${escapeHTML(item.id)}',this)">自动精修抠图</button>
      </div>
      <div class="line"><a href="${escapeHTML(original)}" target="_blank" rel="noopener">看原始图</a> · <a href="${escapeHTML(refined)}" target="_blank" rel="noopener">看当前图</a></div>
    </div>`;
}
async function loadAll(){
  await loadPending();
  await loadApproved();
  await loadPromotions();
}
async function loadPending(){
  if(!key()){status('先输入审核口令。');return}
  status('正在读取待审核武器...');
  try{
    const rows=await rpc('list_pending_weapons_v2',{input_review_key:key()});
    renderWeapons(rows);
    status('武器待审核 '+rows.length+' 件。');
  }catch(err){status(err.message||'读取失败');}
}
async function loadPromotions(){
  if(!key())return;
  try{
    const rows=await rpc('list_pending_promotions',{input_review_key:key()});
    renderPromotions(rows);
    status((document.querySelectorAll('#weaponGrid .card').length||0)+' 件武器待审，'+(document.querySelectorAll('#approvedGrid .card').length||0)+' 件已通过，'+rows.length+' 条推广证明待审核。');
  }catch(err){status(err.message||'读取推广证明失败');}
}
function weaponEditor(item,extra=''){
  return `
    <div class="edit-grid">
      <label>武器名<input data-field="name" maxlength="20" value="${escapeHTML(item.name)}"></label>
      <label>创建者<input data-field="creator" maxlength="16" value="${escapeHTML(item.creator)}"></label>
      <label>类型<select data-field="type">
        <option value="sword" ${item.type==='sword'?'selected':''}>剑刃</option>
        <option value="gun" ${item.type==='gun'?'selected':''}>枪械</option>
        <option value="spear" ${item.type==='spear'?'selected':''}>长柄</option>
      </select></label>
      <label>分类名<input data-field="label" maxlength="20" value="${escapeHTML(item.label||typeLabel(item.type))}"></label>
      <label>技能<input data-field="skill" maxlength="28" value="${escapeHTML(item.skill||'')}"></label>
      <label>积木数<input data-field="piece_count" type="number" min="0" max="300" value="${escapeHTML(item.piece_count||0)}"></label>
      <label>AI战力<input data-field="ai_power" type="number" min="1" max="500" value="${escapeHTML(item.ai_power||100)}"></label>
      <label>收藏等级<select data-field="card_rarity">
        <option value="" ${!item.card_rarity?'selected':''}>自动计算</option>
        <option value="SSR" ${item.card_rarity==='SSR'?'selected':''}>SSR 传说</option>
        <option value="SR" ${item.card_rarity==='SR'?'selected':''}>SR 稀有</option>
        <option value="R" ${item.card_rarity==='R'?'selected':''}>R 精良</option>
        <option value="N" ${item.card_rarity==='N'?'selected':''}>N 普通</option>
      </select></label>
      <label>卡片评分<input data-field="card_score" type="number" min="0" max="999" value="${escapeHTML(item.card_score||0)}" placeholder="0 为自动"></label>
      <label>防御<input data-field="defense" type="number" min="1" max="300" value="${escapeHTML(item.defense||82)}"></label>
      <label>暴击<input data-field="crit" type="number" min="0" max="1" step="0.01" value="${escapeHTML(item.crit||0.12)}"></label>
      <label>展示图地址<input data-field="showcase_url" value="${escapeHTML(item.showcase_url||'')}" placeholder="上传后自动填入"></label>
      <label>显示站点<select data-field="locale">
        <option value="both" ${(item.locale||'both')==='both'?'selected':''}>中英文都显示</option>
        <option value="zh-CN" ${item.locale==='zh-CN'?'selected':''}>只显示中文站</option>
        <option value="en" ${item.locale==='en'?'selected':''}>只显示英文站</option>
      </select></label>
      <label>英文名<input data-field="name_en" maxlength="40" value="${escapeHTML(item.name_en||'')}" placeholder="English weapon name"></label>
      <label>英文分类<input data-field="label_en" maxlength="28" value="${escapeHTML(item.label_en||'')}" placeholder="Blade / Blaster..."></label>
      <label>英文技能<input data-field="skill_en" maxlength="40" value="${escapeHTML(item.skill_en||'')}" placeholder="English skill name"></label>
    </div>
    <textarea data-field="description" maxlength="120" placeholder="武器介绍">${escapeHTML(item.description||'')}</textarea>
    <textarea data-field="description_en" maxlength="180" placeholder="English description">${escapeHTML(item.description_en||'')}</textarea>
    ${extra}`;
}
function collectWeaponFields(card){
  const fields={};
  card.querySelectorAll('[data-field]').forEach(input=>fields[input.dataset.field]=input.value.trim());
  return fields;
}
function weakAdminText(value){
  const text=String(value||'').trim();
  if(!text)return true;
  return /^(AI|玩家|Player|IMG|image|我的|未命名|Brick Combo|AI Brick Weapon|An AI-refined|Generated with local fallback)/i.test(text);
}
function cardNeedsCompletion(card){
  const fields=collectWeaponFields(card);
  const requiredText=['name','label','skill','description','name_en','label_en','skill_en','description_en'];
  if(requiredText.some(name=>weakAdminText(fields[name])))return true;
  if(!fields.showcase_url)return true;
  if(!Number(fields.piece_count)||!Number(fields.ai_power)||!fields.card_rarity||!Number(fields.card_score))return true;
  const root=card.querySelector('[data-ai-root]');
  const bg=root&&root.querySelector('[data-ai-bg]');
  const handheld=root&&root.querySelector('[data-ai-handheld]');
  const cutout=root&&root.querySelector('[data-ai-cutout]');
  const emptyAsset=img=>!img||!img.getAttribute('src')||/undefined|null$/i.test(img.getAttribute('src'));
  return emptyAsset(bg)||emptyAsset(handheld)||emptyAsset(cutout);
}
async function bulkCompleteWeapons(scope,btn){
  if(!key()){status('先输入审核口令。');return}
  const selector=scope==='pending'?'#weaponGrid .card':scope==='approved'?'#approvedGrid .card':'#weaponGrid .card,#approvedGrid .card';
  const cards=[...document.querySelectorAll(selector)];
  if(!cards.length){status('当前页面没有可补全的武器，请先点“进入审核”或刷新后台数据。');return}
  const targets=cards.filter(cardNeedsCompletion);
  if(!targets.length){status('当前已加载武器资料和图片都比较完整，不需要批量补。');return}
  const providerSelect=document.getElementById('aiProvider');
  const previousProvider=providerSelect&&providerSelect.value;
  if(providerSelect)providerSelect.value='local';
  btn.disabled=true;
  status('开始批量补全 '+targets.length+' 件武器。默认本地自动，不消耗 API。');
  let ok=0,fail=0;
  for(let i=0;i<targets.length;i++){
    const card=targets[i];
    const id=card.dataset.id;
    const name=(card.querySelector('[data-field="name"]')&&card.querySelector('[data-field="name"]').value)||id;
    const runBtn=card.querySelector('[data-batch-refine-button]')||card.querySelector('.ai-workbench .good')||btn;
    status('批量补全 '+(i+1)+'/'+targets.length+'：'+name);
    try{
      await aiRefineFull(id,runBtn);
      ok++;
    }catch(err){
      console.error(err);
      fail++;
      setAIStatus(card,'批量补全失败：'+((err&&err.message)||'未知错误'));
    }
    await new Promise(resolve=>setTimeout(resolve,350));
  }
  if(providerSelect&&previousProvider)providerSelect.value=previousProvider;
  btn.disabled=false;
  status('批量补全完成：成功 '+ok+' 件，失败 '+fail+' 件。请刷新后台和公开站检查效果。');
}

async function reviewWeapon(id,decision,btn){
  const card=btn.closest('.card');
  const note=card.querySelector('textarea:not([data-field])').value.trim();
  await saveWeapon(id,btn,true);
  const fields=collectWeaponFields(card);
  btn.disabled=true;
  status(decision==='approved'?'正在通过...':'正在拒绝...');
  try{
    await rpc('review_weapon_with_edits',{
      input_review_key:key(),
      weapon_id:id,
      decision,
      note,
      edited_name:fields.name,
      edited_creator:fields.creator,
      edited_piece_count:Number(fields.piece_count||0),
      edited_ai_power:Number(fields.ai_power||100),
      edited_card_rarity:fields.card_rarity,
      edited_card_score:Number(fields.card_score||0),
      edited_defense:Number(fields.defense||82),
      edited_crit:Number(fields.crit||0.12)
    });
    card.remove();
    status(decision==='approved'?'已通过。':'已拒绝。');
    if(!document.querySelector('#weaponGrid .card'))loadPending();
  }catch(err){
    btn.disabled=false;
    status(err.message||'操作失败');
  }
}

async function uploadShowcase(id,btn){
  const card=btn.closest('.card');
  const file=card.querySelector('[data-showcase-file]').files[0];
  if(!file){status('先选择一张展示图。');return}
  btn.disabled=true;
  status('正在上传展示图...');
  try{
    const ext=(file.type&&file.type.includes('png'))?'png':'webp';
    const path='showcase-'+id+'-'+Date.now()+'.'+ext;
    const res=await fetch(cloudBase()+'/storage/v1/object/'+encodeURIComponent(CLOUD.imageBucket||'mumu-weapon-images')+'/'+encodeURIComponent(path),{
      method:'POST',
      headers:{apikey:CLOUD.anonKey,Authorization:'Bearer '+CLOUD.anonKey,'Content-Type':file.type||'image/webp'},
      body:file

    if(!res.ok)throw new Error('展示图上传失败：'+res.status);

async function imageUrlToCanvas(url,maxEdge=1300){
  const res=await fetch(url,{mode:'cors',cache:'no-store'});
  if(!res.ok)throw new Error('图片读取失败：'+res.status);
  const blob=await res.blob();
  const bitmap=await createImageBitmap(blob);
  const scale=Math.min(1,maxEdge/Math.max(bitmap.width,bitmap.height));
  const canvas=document.createElement('canvas');
  canvas.width=Math.max(1,Math.round(bitmap.width*scale));
  canvas.height=Math.max(1,Math.round(bitmap.height*scale));
  const ctx=canvas.getContext('2d',{willReadFrequently:true});
  ctx.drawImage(bitmap,0,0,canvas.width,canvas.height);
  return canvas;
}
function medianValue(values){
  if(!values.length)return 0;
  values=values.slice().sort((a,b)=>a-b);
  return values[Math.floor(values.length/2)];
}
function colorStatsFromSamples(samples){
  const bg=[
    medianValue(samples.map(c=>c[0])),
    medianValue(samples.map(c=>c[1])),
    medianValue(samples.map(c=>c[2]))
  ];
  return {bg,spread:medianValue(samples.map(c=>Math.hypot(c[0]-bg[0],c[1]-bg[1],c[2]-bg[2])))};
}
function localEdgeStrength(data,w,h,x,y){
  const left=(y*w+Math.max(0,x-1))*4;
  const right=(y*w+Math.min(w-1,x+1))*4;
  const up=(Math.max(0,y-1)*w+x)*4;
  const down=(Math.min(h-1,y+1)*w+x)*4;
  return (
    Math.abs(data[left]-data[right])+Math.abs(data[left+1]-data[right+1])+Math.abs(data[left+2]-data[right+2])+
    Math.abs(data[up]-data[down])+Math.abs(data[up+1]-data[down+1])+Math.abs(data[up+2]-data[down+2])
  )/2;
}
function brickProtectedRGB(r,g,b,bg,threshold,bright,sat,dist){
  const max=Math.max(r,g,b),min=Math.min(r,g,b);
  const red=r>130&&r>g+14&&r>b+14;
  const yellow=r>128&&g>94&&b<150&&r>b+24&&g>b+18;
  const blue=b>r+12&&b>g+2;
  const cyan=g>r+8&&b>r+8&&bright<232;
  const pink=r>138&&b>96&&g<180&&r>g+10;
  const green=g>r+10&&g>b+6&&bright<225;
  const brown=r>92&&g>48&&b<82&&r>b+34&&sat>54&&bright<150;
  const whiteBrick=bright>180&&sat<24&&dist>threshold*.7;
  const darkBrick=bright<92&&dist>threshold*.22;
  return (max-min>18&&(red||yellow||blue||cyan||pink||green||brown))||whiteBrick||darkBrick;
}
function adminCutoutCanvas(canvas){
  const ctx=canvas.getContext('2d',{willReadFrequently:true});
  const w=canvas.width,h=canvas.height;
  const img=ctx.getImageData(0,0,w,h);
  const data=img.data;
  const samples=[];
  const step=Math.max(1,Math.floor(Math.min(w,h)/36));
  const pushAt=(x,y)=>{const p=(y*w+x)*4;samples.push([data[p],data[p+1],data[p+2]])};
  for(let x=0;x<w;x+=step){pushAt(x,0);pushAt(x,h-1)}
  for(let y=0;y<h;y+=step){pushAt(0,y);pushAt(w-1,y)}
  const stats=colorStatsFromSamples(samples);
  const bg=stats.bg;
  const luminance=bg[0]*.299+bg[1]*.587+bg[2]*.114;
  const bgSat=Math.max(bg[0],bg[1],bg[2])-Math.min(bg[0],bg[1],bg[2]);
  const threshold=Math.max(28,Math.min(112,stats.spread*2.15+(luminance>170?34:24)))*.72;
  const visited=new Uint8Array(w*h);
  const queue=[];
  function scoreAt(x,y){
    const p=(y*w+x)*4;
    const r=data[p],g=data[p+1],b=data[p+2];
    const dist=Math.hypot(r-bg[0],g-bg[1],b-bg[2]);
    const bright=r*.299+g*.587+b*.114;
    const sat=Math.max(r,g,b)-Math.min(r,g,b);
    const edge=localEdgeStrength(data,w,h,x,y);
    const protectedBrick=brickProtectedRGB(r,g,b,bg,threshold,bright,sat,dist)||(edge>54&&(sat>28||dist>threshold*.75));
    const chromaDist=Math.hypot((r-bright)-(bg[0]-luminance),(g-bright)-(bg[1]-luminance),(b-bright)-(bg[2]-luminance));
    const warmFloor=r>b+10&&g>b+4&&sat<44&&bright>88;
    const paleBackground=bright>176&&sat<34;
    const softShadow=bright>42&&bright<luminance-8&&sat<38&&chromaDist<threshold*.62;
    const grayFloor=bgSat<46&&sat<38&&bright>72&&chromaDist<threshold*.68;
    const sameSurface=sat<46&&chromaDist<threshold*.62&&edge<86;
    const smoothBackground=edge<72&&sat<50;
    return {bgLike:!protectedBrick&&smoothBackground&&(dist<threshold||sameSurface||(luminance>165&&paleBackground&&chromaDist<threshold*.72)||(bgSat<58&&warmFloor&&chromaDist<threshold*.74)||grayFloor||softShadow),protectedBrick,sameSurface,sat,bright,chromaDist,edge,dist};
  }
  function push(x,y){
    if(x<0||x>=w||y<0||y>=h)return;
    const idx=y*w+x;
    if(visited[idx])return;
    if(scoreAt(x,y).bgLike){visited[idx]=1;queue.push(idx)}
  }
  for(let x=0;x<w;x++){push(x,0);push(x,h-1)}
  for(let y=0;y<h;y++){push(0,y);push(w-1,y)}
  for(let qi=0;qi<queue.length;qi++){
    const idx=queue[qi],x=idx%w,y=(idx-x)/w;
    push(x+1,y);push(x-1,y);push(x,y+1);push(x,y-1);
  }
  const keep=new Uint8Array(w*h);
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const idx=y*w+x,p=idx*4,score=scoreAt(x,y);
    if(visited[idx]||(!score.protectedBrick&&(score.sameSurface||(score.sat<54&&score.bright>58)||(score.sat<64&&score.bright>78&&score.chromaDist<threshold*1.18)))){
      data[p+3]=0;
    }
    if(data[p+3]>8)keep[idx]=1;
  }
  ctx.putImageData(img,0,0);
  return trimTransparentCanvas(canvas);
}
function normalizeWeaponCutoutCanvas(source,targetW=980,targetH=620){
  const trimmed=trimTransparentCanvas(source);
  const out=document.createElement('canvas');
  out.width=targetW;out.height=targetH;
  const ctx=out.getContext('2d');
  const scale=Math.min(targetW*.96/trimmed.width,targetH*.82/trimmed.height);
  const dw=trimmed.width*scale,dh=trimmed.height*scale;
  ctx.drawImage(trimmed,(targetW-dw)/2,(targetH-dh)/2,dw,dh);
  return out;
}
function trimTransparentCanvas(source){
  const ctx=source.getContext('2d',{willReadFrequently:true});
  const w=source.width,h=source.height;
  const data=ctx.getImageData(0,0,w,h).data;
  let minX=w,minY=h,maxX=-1,maxY=-1;
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    if(data[(y*w+x)*4+3]>18){
      if(x<minX)minX=x;if(y<minY)minY=y;if(x>maxX)maxX=x;if(y>maxY)maxY=y;
    }
  }
  if(maxX<0)return source;
  const pad=Math.round(Math.min(w,h)*.04);
  minX=Math.max(0,minX-pad);minY=Math.max(0,minY-pad);maxX=Math.min(w-1,maxX+pad);maxY=Math.min(h-1,maxY+pad);
  const out=document.createElement('canvas');
  out.width=maxX-minX+1;out.height=maxY-minY+1;
  out.getContext('2d').drawImage(source,minX,minY,out.width,out.height,0,0,out.width,out.height);
  return out;
}
function canvasToBlob(canvas,type='image/webp',quality=.92){
  return new Promise(resolve=>canvas.toBlob(resolve,type,quality));
}
async function fileToWebpBlob(file){
  const bitmap=await createImageBitmap(file);
  const maxEdge=1500;
  const scale=Math.min(1,maxEdge/Math.max(bitmap.width,bitmap.height));
  const canvas=document.createElement('canvas');
  canvas.width=Math.max(1,Math.round(bitmap.width*scale));
  canvas.height=Math.max(1,Math.round(bitmap.height*scale));
  canvas.getContext('2d').drawImage(bitmap,0,0,canvas.width,canvas.height);
  if(file.type==='image/png'||file.type==='image/webp')return await canvasToBlob(canvas,'image/webp',.94);
  return await canvasToBlob(adminCutoutCanvas(canvas),'image/webp',.92);
}
async function uploadImageBlob(blob,id,prefix){
  const mime=blob.type||'image/webp';
  const ext=mime.includes('png')?'png':mime.includes('jpeg')?'jpg':'webp';
  const path=prefix+'-'+id+'-'+Date.now()+'.'+ext;
  const res=await fetch(cloudBase()+'/storage/v1/object/'+encodeURIComponent(CLOUD.imageBucket||'mumu-weapon-images')+'/'+encodeURIComponent(path),{
    method:'POST',
    headers:{apikey:CLOUD.anonKey,Authorization:'Bearer '+CLOUD.anonKey,'Content-Type':mime},
    body:blob
  });
  if(!res.ok)throw new Error('图片上传失败：'+res.status);
  return cloudBase()+'/storage/v1/object/public/'+encodeURIComponent(CLOUD.imageBucket||'mumu-weapon-images')+'/'+encodeURIComponent(path);
}
async function urlToBlob(url){
  const res=await fetch(url,{mode:'cors',cache:'no-store'});
  if(!res.ok)throw new Error('图片读取失败：'+res.status);
  return res.blob();
}
function b64ToBlob(b64,mime='image/png'){
  const bin=atob(b64);
  const bytes=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
  return new Blob([bytes],{type:mime});
}
function extractOpenAIText(data){
  if(data.output_text)return data.output_text;
  const out=[];
  (data.output||[]).forEach(item=>{
    (item.content||[]).forEach(part=>{
      if(part.text)out.push(part.text);
      if(part.type==='output_text'&&part.text)out.push(part.text);
    });
  });
  return out.join('\n').trim();
}
function parseJSONLoose(text){
  const raw=String(text||'').trim();
  try{return JSON.parse(raw)}catch(e){}
  const match=raw.match(/\{[\s\S]*\}/);
  if(match){try{return JSON.parse(match[0])}catch(e){}}
  throw new Error('AI 没有返回可解析的 JSON。');
}
function setAIStatus(card,text){
  status(text);
  const box=card&&card.querySelector('[data-ai-status]');
  if(box)box.textContent=text;
}
function mimeFromBlob(blob){
  return blob.type||'image/jpeg';
}
function blobToDataURL(blob){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>resolve(String(reader.result||''));
    reader.onerror=()=>reject(new Error('图片读取失败'));
    reader.readAsDataURL(blob);
  });
}
async function geminiResponseJSON(prompt,imageUrl){
  const apiKey=aiKey();
  if(!apiKey)throw new Error('先在顶部填写并保存 Google Gemini API Key。');
  const blob=await urlToBlob(imageUrl);
  const dataUrl=await blobToDataURL(blob);
  const base64=dataUrl.split(',')[1]||'';
  const res=await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key='+encodeURIComponent(apiKey),{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({
      contents:[{parts:[
        {text:prompt+'\n\n只输出 JSON，不要 markdown。'},
        {inlineData:{mimeType:mimeFromBlob(blob),data:base64}}
      ]}],
      generationConfig:{responseMimeType:'application/json',temperature:.25}
    })
  });
  if(!res.ok)throw new Error('Google Gemini 识别失败：'+res.status+' '+await res.text());
  const data=await res.json();
  const text=(((data.candidates||[])[0]||{}).content||{}).parts?.map(p=>p.text||'').join('')||'';
  return parseJSONLoose(text);
}
function extractOpenRouterText(data){
  const msg=((data.choices||[])[0]||{}).message||{};
  if(typeof msg.content==='string')return msg.content;
  if(Array.isArray(msg.content))return msg.content.map(p=>p.text||'').join('\n');
  return '';
}

function supportsOpenRouterImage(model){
  const arch=model.architecture||{};
  const input=arch.input_modalities||arch.inputModalities||[];
  const output=arch.output_modalities||arch.outputModalities||[];
  const id=String(model.id||'').toLowerCase();
  const name=String(model.name||'').toLowerCase();
  const blocked=id.includes('lyria')||name.includes('lyria')||id.includes('audio')||id.includes('music')||id.includes('google/gemma')||id.includes('nvidia/nemotron');
  return !blocked&&Array.isArray(input)&&input.includes('image')&&Array.isArray(output)&&output.includes('text');
}

function preferredOpenRouterModelOrder(id){

  if(id==='openrouter/free')return 0;

async function loadOpenRouterFreeVisionModels(apiKey){
  const cached=localStorage.getItem(OPENROUTER_MODELS_STORAGE);
  if(cached){
    try{
      const parsed=JSON.parse(cached);
      if(Date.now()-parsed.at<1000*60*60*6&&Array.isArray(parsed.models)&&parsed.models.length){
        const bad=new Set(openRouterBadModels().filter(x=>Date.now()-x.at<1000*60*60*12).map(x=>x.model));
        const cleaned=parsed.models.filter(id=>{
          const lower=String(id).toLowerCase();
          return !bad.has(id)&&!lower.includes('lyria')&&!lower.includes('google/gemma')&&!lower.includes('nvidia/nemotron');
        });
        if(cleaned.length)return cleaned;
      }
    }catch(e){}
  }
  try{
    const res=await fetch('https://openrouter.ai/api/v1/models',{headers:{Authorization:'Bearer '+apiKey}});
    if(!res.ok)throw new Error('models '+res.status);
    const data=await res.json();
    const models=(data.data||[])
      .filter(m=>isFreeOpenRouterModel(m)&&supportsOpenRouterImage(m))
      .map(m=>m.id)
      .sort((a,b)=>preferredOpenRouterModelOrder(a)-preferredOpenRouterModelOrder(b)||a.localeCompare(b));
    const bad=new Set(openRouterBadModels().filter(x=>Date.now()-x.at<1000*60*60*12).map(x=>x.model));
    const merged=['openrouter/free'].concat(models.filter(id=>id!=='openrouter/free')).filter(id=>!bad.has(id));
    if(merged.length)localStorage.setItem(OPENROUTER_MODELS_STORAGE,JSON.stringify({at:Date.now(),models:merged}));
    return merged.length?merged:['openrouter/free'];
  }catch(err){
    return ['openrouter/free'];
  }
}

async function openRouterResponseJSON(prompt,imageUrl){
  const apiKey=aiKey();
  if(!apiKey)throw new Error('先在顶部填写并保存 OpenRouter API Key。');
  const dataUrl=await blobToDataURL(await urlToBlob(imageUrl));
  const models=await loadOpenRouterFreeVisionModels(apiKey);
  let lastError='';
  const tried=[];
  for(const model of models){
    tried.push(model);
    const controller=new AbortController();
    const timeout=setTimeout(()=>controller.abort(),18000);
    try{
      const res=await fetch('https://openrouter.ai/api/v1/chat/completions',{
        method:'POST',
        signal:controller.signal,
        headers:openRouterHeaders(apiKey),
        body:JSON.stringify({
          model,
          messages:[{role:'user',content:[
            {type:'text',text:prompt+'\n\nReturn JSON only. No markdown.'},
            {type:'image_url',image_url:{url:dataUrl}}
          ]}],
          response_format:{type:'json_object'},
          max_tokens:900,
          temperature:.25
        })
      });
      clearTimeout(timeout);
      const raw=await res.text();
      if(!res.ok){
        lastError=model+' '+res.status+' '+raw.slice(0,220);
        if(res.status===401||/Missing Authentication header|BYOK|own key/i.test(raw))markOpenRouterBadModel(model,lastError);
        continue;
      }
      const parsed=parseJSONLoose(extractOpenRouterText(JSON.parse(raw)));
      parsed.openrouter_model_used=model;
      return parsed;
    }catch(err){
      clearTimeout(timeout);
      lastError=model+' '+((err&&err.name)==='AbortError'?'timeout':((err&&err.message)||'failed'));
    }
  }
  const fallback=await localWeaponFallbackJSON(imageUrl,'已自动尝试 '+tried.length+' 个模型，最后错误：'+lastError);
  return fallback;
}

    const cutoutBlob=localImageProvider

      : await openAIImageEdit(originalBlob,'Remove the background from this brick toy weapon photo. Keep the entire weapon complete, including small separated colorful LEGO-style bricks, studs, handles, barrels, blade tips, shadows on the weapon surface, and all colored pieces. Output only the weapon on a transparent background. Do not simplify, crop, redraw, or remove colored bricks. Preserve the original toy shape and colors.',{background:'transparent',output_format:'png',size:'1024x1024',fileName:'brick-weapon.png'});
    const cutoutUrl=await uploadImageBlob(cutoutBlob,id,'ai-cutout');
    await replaceMainImage(id,cutoutUrl,source,btn);
    if(root&&root.querySelector('[data-ai-cutout]'))root.querySelector('[data-ai-cutout]').src=cutoutUrl;
    if(localImageProvider){
      setAIStatus(card,provider==='local'?'本地自动 3/4：生成统一橱窗背景...':provider==='openrouter'?('OpenRouter 3/4：已用 '+escapeHTML(ai.openrouter_model_used||'免费模型')+' 识别，本地生成专属卡片背景...'):'Google 全流程 3/4：生成专属卡片背景...');
      const bgResult=provider==='openrouter'||provider==='local'
        ? {blob:await fallbackCardBackground(ai),fallback:true,error:'OpenRouter free models do not generate images'}
        : await safeGeminiImageGenerate(backgroundPrompt(ai,style),{},()=>fallbackCardBackground(ai));
      const bgBlob=bgResult.blob;
      const bgUrl=await uploadImageBlob(bgBlob,id,provider==='local'?'local-card-bg':provider==='openrouter'?'openrouter-card-bg':'gemini-card-bg');
      if(root&&root.querySelector('[data-ai-bg]'))root.querySelector('[data-ai-bg]').src=bgUrl;
      setAIStatus(card,provider==='local'?'本地自动 4/4：合成大武器展示图...':provider==='openrouter'?'OpenRouter 免费模型 4/4：本地合成角色手持展示图...':(bgResult.fallback?'Google 图片额度不足，已用本地高级卡片背景兜底。继续生成展示图...':'Google 全流程 4/4：生成角色手持展示图...'));
      const handResult=provider==='openrouter'||provider==='local'
        ? {blob:await fallbackHandheldShowcase(ai,cutoutBlob),fallback:true,error:'OpenRouter free models do not generate images'}
        : await safeGeminiImageGenerate(handheldPrompt(ai,style,character),{imageBlob:cutoutBlob},()=>fallbackHandheldShowcase(ai,cutoutBlob));
      const handBlob=handResult.blob;
      const handUrl=await uploadImageBlob(handBlob,id,provider==='local'?'local-handheld':provider==='openrouter'?'openrouter-handheld':'gemini-handheld');
      const showcaseInput=card.querySelector('[data-field="showcase_url"]');
      if(showcaseInput)showcaseInput.value=handUrl;
      if(root&&root.querySelector('[data-ai-handheld]'))root.querySelector('[data-ai-handheld]').src=handUrl;
      await saveWeapon(id,btn,true);
      try{
        await rpc('admin_update_weapon_ai_assets',{
          input_review_key:key(),
          weapon_id:id,
          refined_image_url:cutoutUrl,
          card_background_url:bgUrl,
          handheld_showcase_url:handUrl,
          ai_metadata:Object.assign({},ai,{admin_ai_provider:provider,filled_fields:fields,background_fallback:bgResult.fallback,handheld_fallback:handResult.fallback,background_error:bgResult.error,handheld_error:handResult.error})
        });
      }catch(metaErr){
        setAIStatus(card,'Google 图片已生成；但 AI 元数据保存失败。展示图地址已填入表单，可手动保存。');
        return;
      }
      setAIStatus(card,provider==='local'?'本地自动流程完成：文字、属性、主体图、统一橱窗背景和大武器展示图都已保存。':provider==='openrouter'?'OpenRouter 流程完成：免费模型识别成功，背景和手持展示图已用本地高级生成器保存。':((bgResult.fallback||handResult.fallback)?'流程完成：Google 识别成功，图片额度不足的部分已用本地高级背景/展示图兜底并保存。':'Google 全流程完成：属性、主体图、卡片背景、角色手持展示图都已保存。'));
      return;
    }
    setAIStatus(card,'AI 全流程 3/4：生成专属卡片背景...');
    const bgBlob=await openAIImageGenerate(backgroundPrompt(ai,style),{size:'1024x1536',output_format:'webp'});
    const bgUrl=await uploadImageBlob(bgBlob,id,'ai-card-bg');
    if(root&&root.querySelector('[data-ai-bg]'))root.querySelector('[data-ai-bg]').src=bgUrl;
    setAIStatus(card,'AI 全流程 4/4：生成角色手持展示图...');
    const handBlob=await openAIImageEdit(cutoutBlob,handheldPrompt(ai,style,character),{size:'1024x1536',output_format:'webp',fileName:'weapon-cutout.png'});
    const handUrl=await uploadImageBlob(handBlob,id,'ai-handheld');
    const showcaseInput=card.querySelector('[data-field="showcase_url"]');
    if(showcaseInput)showcaseInput.value=handUrl;
    if(root&&root.querySelector('[data-ai-handheld]'))root.querySelector('[data-ai-handheld]').src=handUrl;
    await saveWeapon(id,btn,true);
    try{
      await rpc('admin_update_weapon_ai_assets',{
        input_review_key:key(),
        weapon_id:id,
        refined_image_url:cutoutUrl,
        card_background_url:bgUrl,
        handheld_showcase_url:handUrl,
        ai_metadata:Object.assign({},ai,{admin_ai_style:style,admin_ai_character:character,filled_fields:fields})
      });
      setAIStatus(card,'AI 全流程完成：主体、背景、手持展示图、属性都已保存。审核通过后公开站会显示新版展示图。');
    }catch(metaErr){
      setAIStatus(card,'AI 图片和表单已保存；但 AI 元数据保存失败。请运行新版 supabase-schema.sql 后再试一次保存元数据。');
    }
  }catch(err){
    setAIStatus(card,(err&&err.message)||'AI 全流程失败。若提示函数不存在，请先运行新版 supabase-schema.sql。');
  }finally{
    btn.disabled=false;
  }
}
async function replaceMainImage(id,nextUrl,originalUrl,btn){
  try{
    await rpc('admin_replace_weapon_image',{
      input_review_key:key(),
      weapon_id:id,
      new_image_url:nextUrl,
      original_image_url:originalUrl||''
    });
  }catch(err){
    if(!String((err&&err.message)||'').includes('admin_replace_weapon_image'))throw err;
    await rpc('admin_update_weapon_ai_assets',{
      input_review_key:key(),
      weapon_id:id,
      refined_image_url:nextUrl,
      card_background_url:'',
      handheld_showcase_url:'',
      ai_metadata:{fallback:'admin_update_weapon_ai_assets',original_image_url:originalUrl||''}
    });
  }
  const card=btn.closest('.card');
  const current=card.querySelector('[data-current-image]');
  const hero=card.querySelector('.image img');
  if(current)current.src=nextUrl;
  if(hero)hero.src=nextUrl;
}
async function autoRefineMainImage(id,btn){
  const card=btn.closest('.card');
  const originalSource=card.querySelector('.refine-tools');
  const img=card.querySelector('[data-current-image]');
  const source=(originalSource&&originalSource.dataset.originalImage)||(img&&img.src);
  if(!source){status('没有找到可处理的图片。');return}
  btn.disabled=true;
  status('正在自动精修主体图...');
  try{
    const canvas=await imageUrlToCanvas(source);
    const refined=adminCutoutCanvas(canvas);
    const blob=await canvasToBlob(refined,'image/webp',.92);
    const url=await uploadImageBlob(blob,id,'refined-weapon');
    await replaceMainImage(id,url,source,btn);
    status('主体图已自动精修并保存。公开站刷新后会显示新版。');
  }catch(err){
    status((err&&err.message)||'自动精修失败。若提示函数不存在，请先运行新版 supabase-schema.sql 里的 admin_replace_weapon_image SQL。');
  }finally{
    btn.disabled=false;
  }
}
async function uploadMainImage(id,btn){
  const card=btn.closest('.card');
  const file=card.querySelector('[data-main-image-file]').files[0];
  if(!file){status('先选择一张透明 PNG/WebP 或要处理的照片。');return}
  const img=card.querySelector('[data-current-image]');
  const originalSource=card.querySelector('.refine-tools');
  const original=(originalSource&&originalSource.dataset.originalImage)||(img&&img.src)||'';
  btn.disabled=true;
  status('正在上传替换主体图...');
  try{
    const blob=await fileToWebpBlob(file);
    const url=await uploadImageBlob(blob,id,'main-weapon');
    await replaceMainImage(id,url,original,btn);
    status('主体图已替换并保存。公开站刷新后会显示新版。');
  }catch(err){
    status((err&&err.message)||'主体图替换失败。若提示函数不存在，请先运行新版 supabase-schema.sql 里的 admin_replace_weapon_image SQL。');
  }finally{
    btn.disabled=false;
  }
}
function renderPromotions(rows){
  const grid=document.getElementById('promoGrid');
  if(!rows.length){grid.innerHTML='<div class="panel empty">暂时没有待审核推广证明。</div>';return}
  grid.innerHTML=rows.map(item=>`
    <div class="panel card" data-id="${escapeHTML(item.id)}">
      <div class="meta">
        <div class="name">${escapeHTML(item.creator)}</div>
        <div class="chips"><span class="chip">奖励 +${escapeHTML(item.bonus_slots)} 名额</span></div>
        <div class="line">证明：${escapeHTML(item.proof)}</div>
        <textarea placeholder="审核备注，可不填"></textarea>
        <div class="actions">
          <button class="good" onclick="reviewPromotion('${escapeHTML(item.id)}','approved',this)">通过</button>
          <button class="bad" onclick="reviewPromotion('${escapeHTML(item.id)}','rejected',this)">拒绝</button>
        </div>
      </div>
    </div>`).join('');
}
async function reviewPromotion(id,decision,btn){
  const card=btn.closest('.card');
  const note=card.querySelector('textarea').value.trim();
  btn.disabled=true;
  status(decision==='approved'?'正在通过推广证明...':'正在拒绝推广证明...');
  try{
    await rpc('review_promotion',{input_review_key:key(),promotion_id:id,decision,note});
    card.remove();
    status(decision==='approved'?'推广证明已通过，用户刷新后获得 +10 名额。':'推广证明已拒绝。');
    if(!document.querySelector('#promoGrid .card'))loadPromotions();
  }catch(err){
    btn.disabled=false;
    status(err.message||'操作失败');
  }
}
</script>
